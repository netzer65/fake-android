<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reflex Tap Arcade – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .reflex-hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .hud-box {
      background: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 18px;
      padding: 12px;
      text-align: center;
    }
    .hud-val {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--md-sys-color-primary);
    }
    .hud-lbl {
      font-size: 11px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface-variant);
      margin-top: 2px;
    }
    .arena-wrap {
      position: relative;
      height: 360px;
      border-radius: 26px;
      background: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
    }
    .reflex-target {
      position: absolute;
      width: 66px;
      height: 66px;
      border-radius: 999px;
      border: none;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
      transform: translate(-50%, -50%) scale(1);
      transition: transform 0.1s ease, background 0.15s ease;
    }
    .reflex-target:active {
      transform: translate(-50%, -50%) scale(0.9);
    }
    .reflex-target.bonus {
      background: var(--md-sys-color-tertiary);
      color: var(--md-sys-color-on-tertiary);
    }
    .arena-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      text-align: center;
      background: color-mix(in srgb, var(--md-sys-color-surface) 84%, transparent);
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <header class="app-topbar">
      <div class="app-title-group">
        <a href="play.html" class="icon-btn" title="Google Play">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <h1 style="font-size:21px;font-weight:700;">Reflex Tap Arcade</h1>
          <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);" id="reflex-sub">30 Sekunden · So viele Ziele wie möglich treffen</div>
        </div>
      </div>
      <button class="m3-btn m3-btn-tonal" onclick="startRound()">Neu</button>
    </header>

    <main class="app-main">
      <div class="reflex-hud">
        <div class="hud-box">
          <div class="hud-val" id="hud-score">0</div>
          <div class="hud-lbl">Punkte</div>
        </div>
        <div class="hud-box">
          <div class="hud-val" id="hud-time">30.0s</div>
          <div class="hud-lbl">Zeit</div>
        </div>
        <div class="hud-box">
          <div class="hud-val" id="hud-best">0</div>
          <div class="hud-lbl">Rekord</div>
        </div>
      </div>

      <div class="arena-wrap" id="reflex-arena" onclick="handleArenaMiss(event)">
        <button type="button" class="reflex-target" id="reflex-target" style="display:none;" onclick="handleTargetHit(event)">+1</button>
        <div class="arena-overlay" id="reflex-overlay">
          <span class="material-symbols-rounded filled" style="font-size:44px;color:var(--md-sys-color-primary);">sports_esports</span>
          <div style="font-size:18px;font-weight:700;" id="overlay-title">Bereit für den Reflex-Test?</div>
          <div style="font-size:13px;color:var(--md-sys-color-on-surface-variant);max-width:300px;" id="overlay-desc">
            Tippe schnell auf die Kreise. Goldene Ziele geben +3 Punkte, Fehltipps kosten 1 Punkt.
          </div>
          <button type="button" class="m3-btn" onclick="startRound()">
            <span class="material-symbols-rounded" style="font-size:18px;">play_arrow</span>
            <span>Runde starten</span>
          </button>
        </div>
      </div>
    </main>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();

    const ROUND_MS = 30000;
    let score = 0;
    let bestScore = 0;
    let running = false;
    let roundEndAt = 0;
    let tickHandle = null;
    let isBonusTarget = false;

    function loadBest() {
      const st = AndroidOS.getState();
      bestScore = Number(st.reflexBestScore || 0);
      document.getElementById('hud-best').textContent = String(bestScore);
    }

    function saveBestIfNeeded() {
      if (score > bestScore) {
        bestScore = score;
        AndroidOS.updateState(s => {
          s.reflexBestScore = bestScore;
        });
        document.getElementById('hud-best').textContent = String(bestScore);
      }
    }

    function placeTarget() {
      const arena = document.getElementById('reflex-arena');
      const btn = document.getElementById('reflex-target');
      if (!arena || !btn) return;

      const pad = 44;
      const w = Math.max(100, arena.clientWidth - pad * 2);
      const h = Math.max(100, arena.clientHeight - pad * 2);
      const x = pad + Math.random() * w;
      const y = pad + Math.random() * h;

      isBonusTarget = Math.random() < 0.22;
      btn.classList.toggle('bonus', isBonusTarget);
      btn.textContent = isBonusTarget ? '+3' : '+1';
      btn.style.left = `${x}px`;
      btn.style.top = `${y}px`;
      btn.style.display = 'inline-flex';
    }

    function handleTargetHit(e) {
      e.stopPropagation();
      if (!running) return;
      score += isBonusTarget ? 3 : 1;
      document.getElementById('hud-score').textContent = String(score);
      saveBestIfNeeded();
      placeTarget();
    }

    function handleArenaMiss(e) {
      if (!running) return;
      if (e.target.closest('#reflex-target') || e.target.closest('#reflex-overlay')) return;
      score = Math.max(0, score - 1);
      document.getElementById('hud-score').textContent = String(score);
    }

    function finishRound() {
      running = false;
      clearInterval(tickHandle);
      tickHandle = null;
      document.getElementById('reflex-target').style.display = 'none';
      document.getElementById('hud-time').textContent = '0.0s';
      saveBestIfNeeded();

      const overlay = document.getElementById('reflex-overlay');
      document.getElementById('overlay-title').textContent = `Runde beendet: ${score} Punkte`;
      document.getElementById('overlay-desc').textContent = `Dein persönlicher Rekord liegt bei ${bestScore} Punkten.`;
      overlay.style.display = 'flex';
    }

    function startRound() {
      clearInterval(tickHandle);
      score = 0;
      running = true;
      roundEndAt = performance.now() + ROUND_MS;

      document.getElementById('hud-score').textContent = '0';
      document.getElementById('hud-time').textContent = '30.0s';
      document.getElementById('reflex-overlay').style.display = 'none';
      placeTarget();

      tickHandle = setInterval(() => {
        const leftMs = Math.max(0, roundEndAt - performance.now());
        document.getElementById('hud-time').textContent = `${(leftMs / 1000).toFixed(1)}s`;
        if (leftMs <= 0) {
          finishRound();
        }
      }, 100);
    }

    loadBest();
  </script>
</body>
</html>
