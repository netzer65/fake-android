<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uhr & Timer – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .big-clock {
      font-family: var(--font-display);
      font-size: clamp(44px, 9vw, 68px);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--md-sys-color-primary);
    }
    .timer-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }
    .timer-digits {
      font-family: var(--font-mono);
      font-size: 32px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <header class="app-topbar">
      <div class="app-title-group">
        <a href="start.html" class="icon-btn" title="Startbildschirm">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <h1 style="font-size:22px;font-weight:700;">Uhr & Timer</h1>
          <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">Weltzeit & parallele Timer</div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <div class="m3-card-filled" style="margin-bottom:18px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;">
        <div>
          <div id="live-clock" class="big-clock">12:00:00</div>
          <div id="live-date" style="font-weight:600;color:var(--md-sys-color-on-surface-variant);">Nordhorn · MEZ</div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          <button class="m3-chip" onclick="addTimer('Kurze Pause', 5)">+ 5 Min.</button>
          <button class="m3-chip" onclick="addTimer('Pomodoro Fokus', 25)">+ 25 Min.</button>
          <button class="m3-chip" onclick="addTimer('Arbeitssprint', 45)">+ 45 Min.</button>
        </div>
      </div>

      <div class="m3-card" style="margin-bottom:18px;display:flex;gap:10px;flex-wrap:wrap;">
        <input type="text" id="t-label" class="m3-input" style="flex:2;min-width:180px;" placeholder="Timer-Name (z. B. Fokus-Session)">
        <input type="number" id="t-mins" class="m3-input" style="flex:1;min-width:110px;" value="15" min="1" max="240">
        <button class="m3-btn" onclick="createCustomTimer()">
          <span class="material-symbols-rounded" style="font-size:18px;">add</span>
          <span>Starten</span>
        </button>
      </div>

      <div id="timer-list"></div>
    </main>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();

    function addTimer(label, mins) {
      const sec = mins * 60;
      AndroidOS.updateState(s => {
        s.timers.unshift({
          id: 't_' + Date.now(),
          label,
          duration: sec,
          remaining: sec,
          running: true,
          endAt: Date.now() + sec * 1000
        });
      });
      renderTimers();
    }

    function createCustomTimer() {
      const label = document.getElementById('t-label').value.trim() || 'Timer';
      const mins = Math.max(1, Number(document.getElementById('t-mins').value) || 10);
      addTimer(label, mins);
      document.getElementById('t-label').value = '';
    }

    function toggleTimer(id) {
      const now = Date.now();
      AndroidOS.updateState(s => {
        const t = s.timers.find(x => x.id === id);
        if (!t) return;
        if (t.running) {
          t.remaining = Math.max(0, Math.ceil((t.endAt - now) / 1000));
          t.running = false;
          t.endAt = null;
        } else {
          if (t.remaining <= 0) t.remaining = t.duration;
          t.running = true;
          t.endAt = now + t.remaining * 1000;
        }
      });
      renderTimers();
    }

    function resetTimer(id) {
      AndroidOS.updateState(s => {
        const t = s.timers.find(x => x.id === id);
        if (!t) return;
        t.running = false;
        t.endAt = null;
        t.remaining = t.duration;
      });
      renderTimers();
    }

    function deleteTimer(id) {
      AndroidOS.updateState(s => {
        s.timers = s.timers.filter(x => x.id !== id);
      });
      renderTimers();
    }

    function renderTimers() {
      const now = new Date();
      document.getElementById('live-clock').textContent = now.toLocaleTimeString('de-DE');
      document.getElementById('live-date').textContent = `${AndroidOS.formatDate(now)} · Nordhorn`;

      const timers = AndroidOS.getActiveTimers();
      const list = document.getElementById('timer-list');
      if (timers.length === 0) {
        list.innerHTML = `<div class="m3-card" style="text-align:center;color:var(--md-sys-color-on-surface-variant);">Keine Timer aktiv.</div>`;
        return;
      }

      list.innerHTML = timers.map(t => `
        <div class="m3-card timer-card">
          <div>
            <div style="font-size:14px;font-weight:700;color:var(--md-sys-color-primary);margin-bottom:4px;">${t.label}</div>
            <div class="timer-digits">${t.finished ? '00:00 · Fertig!' : AndroidOS.formatSeconds(t.remaining)}</div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="m3-btn" style="padding:10px 14px;" onclick="toggleTimer('${t.id}')">
              <span class="material-symbols-rounded">${t.running ? 'pause' : 'play_arrow'}</span>
            </button>
            <button class="icon-btn" onclick="resetTimer('${t.id}')" title="Zurücksetzen">
              <span class="material-symbols-rounded">restart_alt</span>
            </button>
            <button class="icon-btn" onclick="deleteTimer('${t.id}')" title="Löschen">
              <span class="material-symbols-rounded">delete</span>
            </button>
          </div>
        </div>
      `).join('');
    }

    renderTimers();
    setInterval(renderTimers, 1000);
  </script>
</body>
</html>
