<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamera – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .cam-box {
      max-width: 560px;
      margin: 0 auto;
      border-radius: 28px;
      padding: 18px;
      background: #111318;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .cam-stage {
      position: relative;
      width: 100%;
      height: 320px;
      border-radius: 20px;
      overflow: hidden;
      background: #1c1f26;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cam-stage video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .cam-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #0061A4, #D1E4FF);
      color: #001D36;
      font-weight: 700;
    }
    .shutter-btn {
      width: 68px;
      height: 68px;
      border-radius: 999px;
      border: 4px solid #fff;
      background: var(--md-sys-color-primary);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <header class="app-topbar">
      <div class="app-title-group">
        <a href="start.html" class="icon-btn" title="Start">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <h1 style="font-size:21px;font-weight:700;">Kamera</h1>
          <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">Live-Kamera & Galerie-Speicher</div>
        </div>
      </div>
      <a href="galerie.html" class="m3-btn m3-btn-tonal">Galerie</a>
    </header>

    <main class="app-main">
      <div class="cam-box">
        <div class="cam-stage">
          <video id="cam-video" autoplay playsinline muted></video>
          <div class="cam-fallback" id="cam-fallback">
            <span class="material-symbols-rounded filled" style="font-size:52px;">photo_camera</span>
            <span id="cam-status-txt">Kamera-Vorschau bereit (Foto oder Datei aufnehmen)</span>
          </div>
        </div>

        <input type="text" id="photo-title" class="m3-input" placeholder="Titel für Aufnahme…" style="background:#1e222b;color:#fff;border-color:#3c424f;">

        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
          <button class="m3-btn m3-btn-tonal" onclick="startLiveCamera()" id="btn-start-cam">
            <span class="material-symbols-rounded" style="font-size:18px;">videocam</span>
            <span>Kamera starten</span>
          </button>
          <button class="shutter-btn" onclick="capturePhoto()" title="Foto aufnehmen"></button>
          <label class="m3-btn m3-btn-outlined" style="color:#fff;border-color:#666;cursor:pointer;">
            <span class="material-symbols-rounded" style="font-size:18px;">upload</span>
            <span>Bild wählen</span>
            <input type="file" accept="image/*" style="display:none;" onchange="importPhotoFile(event)">
          </label>
        </div>
        <div id="cam-hint" style="font-size:12px;color:#cbd5e1;"></div>
      </div>
    </main>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();
    let streamRef = null;

    async function startLiveCamera() {
      const video = document.getElementById('cam-video');
      const fb = document.getElementById('cam-fallback');
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Keine Kamera-API im Browser');
        }
        streamRef = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = streamRef;
        video.style.display = 'block';
        fb.style.display = 'none';
        document.getElementById('cam-hint').textContent = 'Live-Kamera aktiv.';
      } catch (err) {
        document.getElementById('cam-hint').textContent = 'Keine Live-Kamera verfügbar – Nutze Auslöser oder „Bild wählen“.';
      }
    }

    function savePhotoToGallery(title, dataUrl) {
      AndroidOS.updateState(s => {
        s.gallery = Array.isArray(s.gallery) ? s.gallery : [];
        s.gallery.unshift({
          id: 'g_' + Date.now(),
          title: title || 'Aufnahme',
          tag: dataUrl ? 'Foto' : 'Schnappschuss',
          color1: '#0061A4',
          color2: '#D1E4FF',
          icon: 'photo',
          imageData: dataUrl || null
        });
      });
      window.location.href = 'galerie.html';
    }

    function capturePhoto() {
      const title = document.getElementById('photo-title').value.trim() || 'Kamera-Foto';
      const video = document.getElementById('cam-video');
      if (video.style.display !== 'none' && video.videoWidth > 0) {
        const canvas = document.createElement('canvas');
        canvas.width = Math.min(video.videoWidth, 800);
        canvas.height = Math.round((video.videoHeight / video.videoWidth) * canvas.width);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        savePhotoToGallery(title, canvas.toDataURL('image/jpeg', 0.82));
        return;
      }
      savePhotoToGallery(title, null);
    }

    function importPhotoFile(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const title = document.getElementById('photo-title').value.trim() || file.name.replace(/\.[^.]+$/, '');
      const reader = new FileReader();
      reader.onload = () => {
        savePhotoToGallery(title, reader.result);
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
