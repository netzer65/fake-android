<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rechner – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .calc-box {
      max-width: 460px;
      margin: 0 auto;
    }
    .calc-screen {
      background: var(--md-sys-color-surface-container-high);
      border-radius: 28px;
      padding: 20px 24px;
      text-align: right;
      margin-bottom: 14px;
      position: relative;
    }
    .calc-mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      float: left;
      margin-bottom: 6px;
    }
    .calc-expr {
      font-family: var(--font-mono);
      font-size: 15px;
      min-height: 24px;
      color: var(--md-sys-color-on-surface-variant);
      clear: both;
      word-break: break-all;
    }
    .calc-val {
      font-family: var(--font-display);
      font-size: 44px;
      font-weight: 700;
      overflow-x: auto;
      font-variant-numeric: tabular-nums;
      margin-top: 4px;
    }
    .sci-pad {
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .sci-pad.open {
      display: grid;
    }
    .sci-key {
      height: 46px;
      border-radius: 18px;
      border: 1px solid var(--md-sys-color-outline-variant);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      background: var(--md-sys-color-surface-container-low);
      color: var(--md-sys-color-on-surface);
      cursor: pointer;
      transition: transform 0.12s, background 0.15s;
    }
    .sci-key:active {
      transform: scale(0.95);
    }
    .sci-key.accent {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      border-color: transparent;
    }
    .calc-keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .key {
      height: 64px;
      border-radius: 999px;
      border: none;
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 600;
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
      cursor: pointer;
      transition: transform 0.12s, background 0.15s;
      font-variant-numeric: tabular-nums;
    }
    .key:active { transform: scale(0.94); }
    .key.op {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    .key.ac {
      background: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
    }
    .key.eq {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }

    /* Three-dot menu */
    .menu-wrap {
      position: relative;
    }
    .calc-menu {
      position: absolute;
      top: 48px;
      right: 0;
      min-width: 248px;
      background: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 20px;
      padding: 6px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
      z-index: 55;
      display: none;
    }
    .calc-menu.open {
      display: block;
    }
    .calc-menu-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border: none;
      border-radius: 14px;
      background: transparent;
      color: var(--md-sys-color-on-surface);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
    }
    .calc-menu-item:hover {
      background: color-mix(in srgb, var(--md-sys-color-on-surface) 7%, transparent);
    }
    .calc-menu-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .menu-check {
      font-size: 18px;
      color: var(--md-sys-color-primary);
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <header class="app-topbar">
      <div class="app-title-group">
        <a href="start.html" class="icon-btn" title="Startbildschirm">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <h1 style="font-size:22px;font-weight:700;">Rechner</h1>
          <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);" id="calc-sub">Material 3 Taschenrechner</div>
        </div>
      </div>

      <div class="menu-wrap">
        <button type="button" class="icon-btn" id="calc-more-btn" onclick="toggleCalcMenu(event)" aria-label="Weitere Optionen" title="Weitere Optionen">
          <span class="material-symbols-rounded">more_vert</span>
        </button>
        <div class="calc-menu" id="calc-menu" role="menu">
          <button type="button" class="calc-menu-item" role="menuitemcheckbox" aria-checked="false" onclick="toggleScientificMode()">
            <span class="calc-menu-left">
              <span class="material-symbols-rounded" style="font-size:20px;">science</span>
              <span>Wissenschaftlicher Rechner</span>
            </span>
            <span class="material-symbols-rounded menu-check" id="sci-check" style="visibility:hidden;">check_circle</span>
          </button>
          <button type="button" class="calc-menu-item" role="menuitem" onclick="toggleAngleUnit()">
            <span class="calc-menu-left">
              <span class="material-symbols-rounded" style="font-size:20px;">architecture</span>
              <span>Winkeleinheit</span>
            </span>
            <span id="angle-unit-badge" style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--md-sys-color-primary);">DEG</span>
          </button>
        </div>
      </div>
    </header>

    <main class="app-main">
      <div class="calc-box">
        <div class="calc-screen">
          <span class="calc-mode-badge" id="calc-mode-badge">Standard · DEG</span>
          <div class="calc-expr" id="calc-expr"></div>
          <div class="calc-val" id="calc-val">0</div>
        </div>

        <div class="sci-pad" id="sci-pad" aria-label="Wissenschaftliche Funktionen">
          <button type="button" class="sci-key accent" onclick="applyUnary('sin')">sin</button>
          <button type="button" class="sci-key accent" onclick="applyUnary('cos')">cos</button>
          <button type="button" class="sci-key accent" onclick="applyUnary('tan')">tan</button>
          <button type="button" class="sci-key accent" onclick="applyUnary('sqrt')">√x</button>

          <button type="button" class="sci-key accent" onclick="applyUnary('ln')">ln</button>
          <button type="button" class="sci-key accent" onclick="applyUnary('log10')">log</button>
          <button type="button" class="sci-key accent" onclick="applyUnary('sq')">x²</button>
          <button type="button" class="sci-key accent" onclick="setOp('^')">xʸ</button>

          <button type="button" class="sci-key" onclick="insertConstant('pi')">π</button>
          <button type="button" class="sci-key" onclick="insertConstant('e')">e</button>
          <button type="button" class="sci-key" onclick="applyUnary('inv')">1/x</button>
          <button type="button" class="sci-key" onclick="applyUnary('fact')">n!</button>
        </div>

        <div class="calc-keys">
          <button type="button" class="key ac" onclick="clearAll()">AC</button>
          <button type="button" class="key op" onclick="toggleSign()">±</button>
          <button type="button" class="key op" onclick="percent()">%</button>
          <button type="button" class="key op" onclick="setOp('/')">÷</button>

          <button type="button" class="key" onclick="digit('7')">7</button>
          <button type="button" class="key" onclick="digit('8')">8</button>
          <button type="button" class="key" onclick="digit('9')">9</button>
          <button type="button" class="key op" onclick="setOp('*')">×</button>

          <button type="button" class="key" onclick="digit('4')">4</button>
          <button type="button" class="key" onclick="digit('5')">5</button>
          <button type="button" class="key" onclick="digit('6')">6</button>
          <button type="button" class="key op" onclick="setOp('-')">−</button>

          <button type="button" class="key" onclick="digit('1')">1</button>
          <button type="button" class="key" onclick="digit('2')">2</button>
          <button type="button" class="key" onclick="digit('3')">3</button>
          <button type="button" class="key op" onclick="setOp('+')">+</button>

          <button type="button" class="key" onclick="digit('0')">0</button>
          <button type="button" class="key" onclick="decimal()">,</button>
          <button type="button" class="key" onclick="backspace()">⌫</button>
          <button type="button" class="key eq" onclick="equals()">=</button>
        </div>
      </div>
    </main>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();

    let cur = '0';
    let prev = null;
    let op = null;
    let resetNext = false;
    let scientificMode = false;
    let angleUnit = 'DEG'; // 'DEG' or 'RAD'

    function toggleCalcMenu(e) {
      if (e) e.stopPropagation();
      const menu = document.getElementById('calc-menu');
      if (!menu) return;
      menu.classList.toggle('open');
    }

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('calc-menu');
      const btn = document.getElementById('calc-more-btn');
      if (menu && menu.classList.contains('open')) {
        if (!menu.contains(e.target) && (!btn || !btn.contains(e.target))) {
          menu.classList.remove('open');
        }
      }
    });

    function toggleScientificMode() {
      scientificMode = !scientificMode;
      const pad = document.getElementById('sci-pad');
      const check = document.getElementById('sci-check');
      const sub = document.getElementById('calc-sub');
      if (pad) pad.classList.toggle('open', scientificMode);
      if (check) check.style.visibility = scientificMode ? 'visible' : 'hidden';
      if (sub) sub.textContent = scientificMode ? 'Wissenschaftlicher Rechner' : 'Material 3 Taschenrechner';
      updateUI();
    }

    function toggleAngleUnit() {
      angleUnit = angleUnit === 'DEG' ? 'RAD' : 'DEG';
      updateUI();
    }

    function formatNum(num) {
      if (!Number.isFinite(num)) return 'Fehler';
      const rounded = Math.round(num * 1e10) / 1e10;
      return String(rounded);
    }

    function updateUI() {
      document.getElementById('calc-val').textContent = cur.replace('.', ',');
      const map = { '/': '÷', '*': '×', '-': '−', '+': '+', '^': '^' };
      document.getElementById('calc-expr').textContent = (prev !== null && op) ? `${String(prev).replace('.', ',')} ${map[op] || op}` : '';
      const badge = document.getElementById('calc-mode-badge');
      const unitLabel = document.getElementById('angle-unit-badge');
      if (badge) badge.textContent = `${scientificMode ? 'Wissenschaftlich' : 'Standard'} · ${angleUnit}`;
      if (unitLabel) unitLabel.textContent = angleUnit;
    }

    function digit(d) {
      if (cur === 'Fehler' || resetNext) {
        cur = d;
        resetNext = false;
      } else {
        cur = cur === '0' ? d : cur + d;
      }
      updateUI();
    }

    function decimal() {
      if (cur === 'Fehler' || resetNext) {
        cur = '0.';
        resetNext = false;
      } else if (!cur.includes('.')) {
        cur += '.';
      }
      updateUI();
    }

    function clearAll() {
      cur = '0';
      prev = null;
      op = null;
      resetNext = false;
      updateUI();
    }

    function backspace() {
      if (resetNext || cur === 'Fehler') return;
      cur = cur.length > 1 ? cur.slice(0, -1) : '0';
      updateUI();
    }

    function toggleSign() {
      if (cur === '0' || cur === 'Fehler') return;
      cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur;
      updateUI();
    }

    function percent() {
      const v = parseFloat(cur);
      if (!Number.isNaN(v)) cur = formatNum(v / 100);
      updateUI();
    }

    function toRadians(val) {
      return angleUnit === 'DEG' ? (val * Math.PI) / 180 : val;
    }

    function factorial(n) {
      if (!Number.isInteger(n) || n < 0 || n > 170) return NaN;
      let res = 1;
      for (let i = 2; i <= n; i++) res *= i;
      return res;
    }

    function applyUnary(fn) {
      if (cur === 'Fehler') return;
      const x = parseFloat(cur);
      if (Number.isNaN(x)) return;

      let res = NaN;
      if (fn === 'sin') res = Math.sin(toRadians(x));
      else if (fn === 'cos') res = Math.cos(toRadians(x));
      else if (fn === 'tan') {
        const rad = toRadians(x);
        res = Math.abs(Math.cos(rad)) < 1e-13 ? NaN : Math.tan(rad);
      }
      else if (fn === 'sqrt') res = x < 0 ? NaN : Math.sqrt(x);
      else if (fn === 'sq') res = x * x;
      else if (fn === 'ln') res = x <= 0 ? NaN : Math.log(x);
      else if (fn === 'log10') res = x <= 0 ? NaN : Math.log10(x);
      else if (fn === 'inv') res = x === 0 ? NaN : 1 / x;
      else if (fn === 'fact') res = factorial(x);

      cur = formatNum(res);
      resetNext = true;
      updateUI();
    }

    function insertConstant(c) {
      const val = c === 'pi' ? Math.PI : Math.E;
      cur = formatNum(val);
      resetNext = true;
      updateUI();
    }

    function compute() {
      const a = prev;
      const b = parseFloat(cur);
      if (op === '+') return a + b;
      if (op === '-') return a - b;
      if (op === '*') return a * b;
      if (op === '/') return b === 0 ? NaN : a / b;
      if (op === '^') return Math.pow(a, b);
      return b;
    }

    function setOp(nextOp) {
      if (cur === 'Fehler') return;
      const v = parseFloat(cur);
      if (prev === null) {
        prev = v;
      } else if (!resetNext) {
        const res = compute();
        if (!Number.isFinite(res)) {
          cur = 'Fehler'; prev = null; op = null; updateUI(); return;
        }
        prev = Math.round(res * 1e10) / 1e10;
        cur = String(prev);
      }
      op = nextOp;
      resetNext = true;
      updateUI();
    }

    function equals() {
      if (prev === null || !op || cur === 'Fehler') return;
      const res = compute();
      cur = formatNum(res);
      prev = null;
      op = null;
      resetNext = true;
      updateUI();
    }

    updateUI();
  </script>
</body>
</html>
