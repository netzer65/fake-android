<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .cal-header-card {
      margin-bottom: 14px;
    }
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }
    .cal-month-title {
      font-size: 19px;
      font-weight: 700;
      text-transform: capitalize;
    }
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 6px;
    }
    .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .cal-day-btn {
      aspect-ratio: 1 / 1;
      max-height: 52px;
      width: 100%;
      border-radius: 16px;
      border: 1px solid transparent;
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      position: relative;
      transition: background 0.15s ease, transform 0.12s ease;
    }
    .cal-day-btn:hover {
      background: var(--md-sys-color-surface-container-highest);
    }
    .cal-day-btn:active {
      transform: scale(0.95);
    }
    .cal-day-btn.muted {
      opacity: 0.38;
    }
    .cal-day-btn.today {
      border-color: var(--md-sys-color-primary);
    }
    .cal-day-btn.selected {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-color: transparent;
    }
    .cal-dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: var(--md-sys-color-primary);
    }
    .cal-day-btn.selected .cal-dot {
      background: var(--md-sys-color-on-primary);
    }
    .cal-section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 14px 2px 10px;
      gap: 10px;
      flex-wrap:wrap;
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <header class="app-topbar">
      <div class="app-title-group">
        <a href="start.html" class="icon-btn" title="Startbildschirm">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <h1 style="font-size:22px;font-weight:700;">Kalender</h1>
          <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);" id="cal-subtitle">Monatsübersicht & Termine</div>
        </div>
      </div>
      <button type="button" class="m3-btn m3-btn-tonal" onclick="jumpToToday()">Heute</button>
    </header>

    <main class="app-main">
      <div class="m3-card cal-header-card">
        <div class="cal-nav">
          <button type="button" class="icon-btn" onclick="changeMonth(-1)" title="Vorheriger Monat">
            <span class="material-symbols-rounded">chevron_left</span>
          </button>
          <div class="cal-month-title" id="cal-month-label"></div>
          <button type="button" class="icon-btn" onclick="changeMonth(1)" title="Nächster Monat">
            <span class="material-symbols-rounded">chevron_right</span>
          </button>
        </div>

        <div class="cal-weekdays" id="cal-weekdays"></div>
        <div class="cal-days" id="cal-days"></div>
      </div>

      <div class="m3-card" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
        <input type="text" id="ev-title" class="m3-input" style="flex:2;min-width:190px;" placeholder="Neuer Termin…">
        <input type="date" id="ev-date" class="m3-input" style="flex:1;min-width:140px;">
        <input type="time" id="ev-time" class="m3-input" style="flex:1;min-width:110px;" value="15:00">
        <button type="button" class="m3-btn" onclick="addEvent()">
          <span class="material-symbols-rounded" style="font-size:18px;">event_available</span>
          <span>Speichern</span>
        </button>
      </div>

      <div class="cal-section-head">
        <div style="font-weight:700;font-size:15px;" id="selected-day-heading">Termine</div>
        <div style="display:flex;gap:6px;">
          <button type="button" class="m3-chip active" id="filter-day-btn" onclick="setFilterMode('day')">Ausgewählter Tag</button>
          <button type="button" class="m3-chip" id="filter-all-btn" onclick="setFilterMode('all')">Alle Termine</button>
        </div>
      </div>

      <div id="event-list" style="display:flex;flex-direction:column;gap:10px;"></div>
    </main>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();

    function toIsoDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    const todayObj = new Date();
    const todayIso = toIsoDate(todayObj);
    let viewYear = todayObj.getFullYear();
    let viewMonth = todayObj.getMonth(); // 0-11
    let selectedIso = todayIso;
    let filterMode = 'day'; // 'day' or 'all'

    document.getElementById('ev-date').value = selectedIso;

    function setFilterMode(mode) {
      filterMode = mode;
      document.getElementById('filter-day-btn').classList.toggle('active', mode === 'day');
      document.getElementById('filter-all-btn').classList.toggle('active', mode === 'all');
      renderEvents();
    }

    function changeMonth(delta) {
      viewMonth += delta;
      if (viewMonth < 0) {
        viewMonth = 11;
        viewYear--;
      } else if (viewMonth > 11) {
        viewMonth = 0;
        viewYear++;
      }
      renderCalendar();
    }

    function jumpToToday() {
      const now = new Date();
      viewYear = now.getFullYear();
      viewMonth = now.getMonth();
      selectedIso = toIsoDate(now);
      document.getElementById('ev-date').value = selectedIso;
      renderCalendar();
      renderEvents();
    }

    function selectDay(iso) {
      selectedIso = iso;
      document.getElementById('ev-date').value = iso;
      const parts = iso.split('-').map(Number);
      if (parts.length === 3) {
        viewYear = parts[0];
        viewMonth = parts[1] - 1;
      }
      renderCalendar();
      renderEvents();
    }

    function renderCalendar() {
      const st = AndroidOS.getState();
      const lang = AndroidOS.getLang(st);
      const locale = (AndroidOS.I18N[lang] || AndroidOS.I18N.de).locale;
      const events = st.calendarEvents || [];
      const eventDates = new Set(events.map(e => e.date));

      const monthDate = new Date(viewYear, viewMonth, 1);
      document.getElementById('cal-month-label').textContent =
        monthDate.toLocaleDateString(locale, { month: 'long', year: 'numeric' });

      // Monday-first weekday names
      const wdContainer = document.getElementById('cal-weekdays');
      const wdLabels = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(2026, 10, 16 + i); // 2026-11-16 is Monday
        wdLabels.push(d.toLocaleDateString(locale, { weekday: 'short' }));
      }
      wdContainer.innerHTML = wdLabels.map(w => `<div>${w}</div>`).join('');

      const firstDayMonIdx = (monthDate.getDay() + 6) % 7; // Mon=0..Sun=6
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

      const cells = [];

      // Leading days from previous month
      for (let i = firstDayMonIdx - 1; i >= 0; i--) {
        const dayNum = daysInPrevMonth - i;
        const d = new Date(viewYear, viewMonth - 1, dayNum);
        const iso = toIsoDate(d);
        cells.push({ day: dayNum, iso, muted: true });
      }

      // Current month days
      for (let dayNum = 1; dayNum <= daysInMonth; dayNum++) {
        const d = new Date(viewYear, viewMonth, dayNum);
        const iso = toIsoDate(d);
        cells.push({ day: dayNum, iso, muted: false });
      }

      // Trailing days to complete 5 or 6 weeks cleanly
      const totalTarget = cells.length <= 35 ? 35 : 42;
      let nextDay = 1;
      while (cells.length < totalTarget) {
        const d = new Date(viewYear, viewMonth + 1, nextDay++);
        const iso = toIsoDate(d);
        cells.push({ day: d.getDate(), iso, muted: true });
      }

      const daysContainer = document.getElementById('cal-days');
      daysContainer.innerHTML = cells.map(c => {
        const classes = ['cal-day-btn'];
        if (c.muted) classes.push('muted');
        if (c.iso === todayIso) classes.push('today');
        if (c.iso === selectedIso) classes.push('selected');
        const hasEv = eventDates.has(c.iso);
        return `
          <button type="button" class="${classes.join(' ')}" onclick="selectDay('${c.iso}')">
            <span>${c.day}</span>
            ${hasEv ? '<span class="cal-dot"></span>' : '<span style="width:5px;height:5px;"></span>'}
          </button>
        `;
      }).join('');
    }

    function addEvent() {
      const title = document.getElementById('ev-title').value.trim();
      const date = document.getElementById('ev-date').value || selectedIso;
      const time = document.getElementById('ev-time').value || '12:00';
      if (!title) return;
      AndroidOS.updateState(s => {
        s.calendarEvents = s.calendarEvents || [];
        s.calendarEvents.unshift({ id: 'c_' + Date.now(), title, date, time });
      });
      document.getElementById('ev-title').value = '';
      selectedIso = date;
      renderCalendar();
      renderEvents();
    }

    function removeEvent(id) {
      AndroidOS.updateState(s => {
        s.calendarEvents = (s.calendarEvents || []).filter(e => e.id !== id);
      });
      renderCalendar();
      renderEvents();
    }

    function renderEvents() {
      const st = AndroidOS.getState();
      const all = [...(st.calendarEvents || [])].sort((a, b) => {
        const ka = `${a.date || ''} ${a.time || ''}`;
        const kb = `${b.date || ''} ${b.time || ''}`;
        return ka.localeCompare(kb);
      });

      const list = filterMode === 'day'
        ? all.filter(e => e.date === selectedIso)
        : all;

      const heading = document.getElementById('selected-day-heading');
      heading.textContent = filterMode === 'day'
        ? `Termine am ${selectedIso}`
        : `Alle Termine (${all.length})`;

      const listEl = document.getElementById('event-list');
      if (list.length === 0) {
        listEl.innerHTML = `<div class="m3-card-filled" style="color:var(--md-sys-color-on-surface-variant);text-align:center;">Keine Termine für diesen Zeitraum.</div>`;
        return;
      }

      listEl.innerHTML = list.map(ev => `
        <div class="m3-card-filled" style="display:flex;justify-content:space-between;align-items:center;gap:14px;">
          <div style="display:flex;align-items:center;gap:14px;">
            <div style="padding:10px 14px;border-radius:16px;background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);font-weight:700;text-align:center;min-width:96px;">
              <div style="font-size:12px;">${ev.date || ''}</div>
              <div style="font-size:15px;">${ev.time || ''} Uhr</div>
            </div>
            <div style="font-weight:700;font-size:16px;">${ev.title}</div>
          </div>
          <button type="button" class="icon-btn" onclick="removeEvent('${ev.id}')" title="Löschen">
            <span class="material-symbols-rounded">delete</span>
          </button>
        </div>
      `).join('');
    }

    renderCalendar();
    renderEvents();
  </script>
</body>
</html>
