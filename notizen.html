<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notizen – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .notes-toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .notes-search {
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .notes-search input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--md-sys-color-on-surface);
      font-family: var(--font-sans);
      font-size: 14px;
      outline: none;
    }
    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .color-dot {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.12s ease;
    }
    .color-dot.active {
      border-color: var(--md-sys-color-primary);
      transform: scale(1.12);
    }
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }
    .note-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      border-radius: 22px;
      padding: 16px;
      border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
    }
    .note-card.tone-blue {
      background: #E8F0FE;
      color: #0F223D;
    }
    .note-card.tone-amber {
      background: #FEF3C7;
      color: #362404;
    }
    .note-card.tone-mint {
      background: #DCFCE7;
      color: #0E2E1B;
    }
    .note-card.tone-rose {
      background: #FFE4E6;
      color: #3B1019;
    }
    .note-card.tone-blue .note-muted,
    .note-card.tone-amber .note-muted,
    .note-card.tone-mint .note-muted,
    .note-card.tone-rose .note-muted {
      color: rgba(20, 24, 30, 0.72);
    }
    .note-muted {
      color: var(--md-sys-color-on-surface-variant);
    }
    .note-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      gap: 8px;
    }
    .note-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .note-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 105;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .note-modal-backdrop.open {
      display: flex;
    }
    .note-modal-card {
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 18px;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.28);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <header class="app-topbar">
      <div class="app-title-group">
        <a href="start.html" class="icon-btn" title="Startbildschirm">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <h1 style="font-size:22px;font-weight:700;">Notizen</h1>
          <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);" id="notes-count-sub">Gedanken & schnelle Entwürfe</div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <div class="m3-card" style="display:flex;flex-direction:column;gap:10px;">
        <input type="text" id="note-title" class="m3-input" placeholder="Titel der Notiz…">
        <textarea id="note-body" class="m3-input" rows="3" placeholder="Notiz schreiben…"></textarea>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
          <div class="color-row" id="create-color-row" aria-label="Kartenfarbe wählen">
            <button type="button" class="color-dot active" data-tone="default" style="background:#EAECEF;" title="Standard" onclick="pickCreateTone('default')"></button>
            <button type="button" class="color-dot" data-tone="blue" style="background:#D1E4FF;" title="Blau" onclick="pickCreateTone('blue')"></button>
            <button type="button" class="color-dot" data-tone="amber" style="background:#FFDCBE;" title="Bernstein" onclick="pickCreateTone('amber')"></button>
            <button type="button" class="color-dot" data-tone="mint" style="background:#B7E4C7;" title="Minze" onclick="pickCreateTone('mint')"></button>
            <button type="button" class="color-dot" data-tone="rose" style="background:#FFD8E4;" title="Rosé" onclick="pickCreateTone('rose')"></button>
          </div>
          <button type="button" class="m3-btn" onclick="addNote()">
            <span class="material-symbols-rounded" style="font-size:18px;">add</span>
            <span>Notiz speichern</span>
          </button>
        </div>
      </div>

      <div class="notes-toolbar">
        <div class="notes-search">
          <span class="material-symbols-rounded note-muted" style="font-size:18px;">search</span>
          <input type="search" id="note-search-input" oninput="renderNotes()" placeholder="Notizen durchsuchen…">
        </div>
        <button type="button" class="m3-chip" id="pinned-filter-btn" onclick="togglePinnedFilter()">
          <span class="material-symbols-rounded" style="font-size:17px;">push_pin</span>
          <span>Nur Angepinnte</span>
        </button>
      </div>

      <div class="notes-grid" id="notes-grid"></div>
    </main>

    <div class="note-modal-backdrop" id="note-edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
      <div class="note-modal-card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h2 id="edit-modal-title" style="font-size:18px;font-weight:700;">Notiz bearbeiten</h2>
          <button type="button" class="icon-btn" style="width:32px;height:32px;" onclick="closeEditModal()" title="Schließen">
            <span class="material-symbols-rounded" style="font-size:18px;">close</span>
          </button>
        </div>
        <input type="text" id="edit-note-title" class="m3-input" placeholder="Titel…">
        <textarea id="edit-note-body" class="m3-input" rows="5" placeholder="Inhalt…"></textarea>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px;">
          <button type="button" class="m3-btn m3-btn-outlined" onclick="closeEditModal()">Abbrechen</button>
          <button type="button" class="m3-btn" onclick="saveEditedNote()">Speichern</button>
        </div>
      </div>
    </div>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();

    let selectedCreateTone = 'default';
    let onlyPinned = false;
    let editingNoteId = null;

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function pickCreateTone(tone) {
      selectedCreateTone = tone;
      document.querySelectorAll('#create-color-row .color-dot').forEach(dot => {
        dot.classList.toggle('active', dot.dataset.tone === tone);
      });
    }

    function togglePinnedFilter() {
      onlyPinned = !onlyPinned;
      document.getElementById('pinned-filter-btn').classList.toggle('active', onlyPinned);
      renderNotes();
    }

    function addNote() {
      const titleEl = document.getElementById('note-title');
      const bodyEl = document.getElementById('note-body');
      const title = titleEl.value.trim();
      const body = bodyEl.value.trim();
      if (!title && !body) return;

      AndroidOS.updateState(s => {
        s.notes = Array.isArray(s.notes) ? s.notes : [];
        s.notes.unshift({
          id: 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
          title: title || 'Ohne Titel',
          body,
          tone: selectedCreateTone,
          pinned: false,
          updated: AndroidOS.formatTime(new Date())
        });
      });

      titleEl.value = '';
      bodyEl.value = '';
      pickCreateTone('default');
      renderNotes();
    }

    function togglePinNote(id) {
      AndroidOS.updateState(s => {
        const n = (s.notes || []).find(x => x.id === id);
        if (n) n.pinned = !n.pinned;
      });
      renderNotes();
    }

    function openEditModal(id) {
      const st = AndroidOS.getState();
      const n = (st.notes || []).find(x => x.id === id);
      if (!n) return;
      editingNoteId = id;
      document.getElementById('edit-note-title').value = n.title === 'Ohne Titel' && !n.body ? '' : n.title;
      document.getElementById('edit-note-body').value = n.body || '';
      document.getElementById('note-edit-modal').classList.add('open');
      document.getElementById('edit-note-title').focus();
    }

    function closeEditModal() {
      editingNoteId = null;
      document.getElementById('note-edit-modal').classList.remove('open');
    }

    function saveEditedNote() {
      if (!editingNoteId) return;
      const nextTitle = document.getElementById('edit-note-title').value.trim();
      const nextBody = document.getElementById('edit-note-body').value.trim();
      if (!nextTitle && !nextBody) {
        deleteNote(editingNoteId);
        closeEditModal();
        return;
      }
      AndroidOS.updateState(s => {
        const n = (s.notes || []).find(x => x.id === editingNoteId);
        if (!n) return;
        n.title = nextTitle || 'Ohne Titel';
        n.body = nextBody;
        n.updated = AndroidOS.formatTime(new Date());
      });
      closeEditModal();
      renderNotes();
    }

    function deleteNote(id) {
      AndroidOS.updateState(s => {
        s.notes = (s.notes || []).filter(n => n.id !== id);
      });
      renderNotes();
    }

    function renderNotes() {
      const rawNotes = AndroidOS.getState().notes || [];
      const q = (document.getElementById('note-search-input').value || '').trim().toLowerCase();

      document.getElementById('notes-count-sub').textContent = rawNotes.length
        ? `${rawNotes.length} gespeicherte Notiz${rawNotes.length === 1 ? '' : 'en'}`
        : 'Gedanken & schnelle Entwürfe';

      const sorted = [...rawNotes].sort((a, b) => Number(Boolean(b.pinned)) - Number(Boolean(a.pinned)));
      const filtered = sorted.filter(n => {
        if (onlyPinned && !n.pinned) return false;
        if (!q) return true;
        const hay = `${n.title || ''} ${n.body || ''}`.toLowerCase();
        return hay.includes(q);
      });

      const grid = document.getElementById('notes-grid');
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="m3-card" style="grid-column:1/-1;text-align:center;color:var(--md-sys-color-on-surface-variant);">Keine passenden Notizen gefunden.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(n => {
        const toneClass = ['blue', 'amber', 'mint', 'rose'].includes(n.tone) ? `tone-${n.tone}` : '';
        const pinIconStyle = n.pinned ? 'color:var(--md-sys-color-primary);' : '';
        return `
          <article class="note-card ${toneClass}">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;">
                <h3 style="font-size:17px;font-weight:700;margin:0;word-break:break-word;">${escapeHtml(n.title)}</h3>
                ${n.pinned ? '<span class="material-symbols-rounded filled" style="font-size:17px;flex-shrink:0;">push_pin</span>' : ''}
              </div>
              <p class="note-muted" style="font-size:14px;line-height:1.5;white-space:pre-wrap;margin:0;word-break:break-word;">${escapeHtml(n.body)}</p>
            </div>
            <div class="note-meta-bar note-muted">
              <span>${escapeHtml(n.updated || '')}</span>
              <div class="note-actions">
                <button type="button" class="icon-btn" style="width:32px;height:32px;${pinIconStyle}" onclick="togglePinNote('${n.id}')" title="${n.pinned ? 'Lösen' : 'Anpinnen'}">
                  <span class="material-symbols-rounded ${n.pinned ? 'filled' : ''}" style="font-size:18px;">push_pin</span>
                </button>
                <button type="button" class="icon-btn" style="width:32px;height:32px;" onclick="openEditModal('${n.id}')" title="Bearbeiten">
                  <span class="material-symbols-rounded" style="font-size:18px;">edit</span>
                </button>
                <button type="button" class="icon-btn" style="width:32px;height:32px;" onclick="deleteNote('${n.id}')" title="Löschen">
                  <span class="material-symbols-rounded" style="font-size:18px;">delete</span>
                </button>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    document.getElementById('note-edit-modal').addEventListener('click', e => {
      if (e.target.id === 'note-edit-modal') closeEditModal();
    });

    renderNotes();
  </script>
</body>
</html>
