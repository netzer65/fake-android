<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notizen – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <header class="app-topbar">
      <div class="app-title-group">
        <a href="start.html" class="icon-btn" title="Startbildschirm">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <h1 style="font-size:22px;font-weight:700;">Notizen</h1>
          <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">Gedanken & schnelle Entwürfe</div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <div class="m3-card" style="display:flex;flex-direction:column;gap:10px;">
        <input type="text" id="note-title" class="m3-input" placeholder="Titel der Notiz…">
        <textarea id="note-body" class="m3-input" rows="3" placeholder="Notiz schreiben…"></textarea>
        <div style="display:flex;justify-content:flex-end;">
          <button class="m3-btn" onclick="addNote()">
            <span class="material-symbols-rounded" style="font-size:18px;">add</span>
            <span>Notiz speichern</span>
          </button>
        </div>
      </div>

      <div class="notes-grid" id="notes-grid"></div>
    </main>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();

    function addNote() {
      const title = document.getElementById('note-title').value.trim();
      const body = document.getElementById('note-body').value.trim();
      if (!title && !body) return;
      AndroidOS.updateState(s => {
        s.notes.unshift({
          id: 'n_' + Date.now(),
          title: title || 'Ohne Titel',
          body,
          updated: AndroidOS.formatTime(new Date())
        });
      });
      document.getElementById('note-title').value = '';
      document.getElementById('note-body').value = '';
      renderNotes();
    }

    function deleteNote(id) {
      AndroidOS.updateState(s => {
        s.notes = s.notes.filter(n => n.id !== id);
      });
      renderNotes();
    }

    function renderNotes() {
      const notes = AndroidOS.getState().notes || [];
      document.getElementById('notes-grid').innerHTML = notes.map(n => `
        <div class="m3-card-filled" style="display:flex;flex-direction:column;justify-content:space-between;gap:12px;">
          <div>
            <h3 style="font-size:17px;margin-bottom:6px;">${n.title}</h3>
            <p style="font-size:14px;color:var(--md-sys-color-on-surface-variant);line-height:1.5;white-space:pre-wrap;">${n.body}</p>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--md-sys-color-on-surface-variant);">
            <span>${n.updated}</span>
            <button class="icon-btn" style="width:34px;height:34px;" onclick="deleteNote('${n.id}')">
              <span class="material-symbols-rounded" style="font-size:18px;">delete</span>
            </button>
          </div>
        </div>
      `).join('');
    }

    renderNotes();
  </script>
</body>
</html>
