<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-Duolingo – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .duo-top-stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .duo-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      background: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .duo-option {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-low);
      color: var(--md-sys-color-on-surface);
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.14s ease, background 0.18s ease;
    }
    .duo-option:hover {
      background: var(--md-sys-color-surface-container-highest);
    }
    .duo-option.correct {
      background: #B7E4C7;
      color: #082115;
      border-color: #2D6A4F;
    }
    .duo-option.wrong {
      background: #FFDAD6;
      color: #410002;
      border-color: #BA1A1A;
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <header class="app-topbar">
      <div class="app-title-group">
        <a href="start.html" class="icon-btn" title="Start">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <h1 style="font-size:21px;font-weight:600;">Mini-Duolingo</h1>
        </div>
      </div>
      <div style="display:flex;gap:6px;" id="duo-lang-chips">
        <button type="button" class="m3-chip active" data-lang="es" onclick="setDuoLang('es')">Spanisch</button>
        <button type="button" class="m3-chip" data-lang="fr" onclick="setDuoLang('fr')">Französisch</button>
        <button type="button" class="m3-chip" data-lang="ja" onclick="setDuoLang('ja')">Japanisch</button>
      </div>
    </header>

    <main class="app-main">
      <div class="duo-top-stats">
        <div class="duo-pill">
          <span class="material-symbols-rounded filled" style="color:#E65100;">local_fire_department</span>
          <span id="duo-streak">0 Tage</span>
        </div>
        <div class="duo-pill">
          <span class="material-symbols-rounded filled" style="color:var(--md-sys-color-primary);">bolt</span>
          <span id="duo-xp">0 XP</span>
        </div>
        <div class="duo-pill">
          <span class="material-symbols-rounded filled" style="color:#BA1A1A;">favorite</span>
          <span id="duo-hearts">5</span>
        </div>
      </div>

      <div class="m3-card" id="duo-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <span class="status-pill" id="duo-q-badge">Aufgabe 1</span>
          <span class="settings-item-sub" id="duo-sub-lang">Spanisch · Grundlagen</span>
        </div>
        <h2 style="font-size:20px;margin-bottom:8px;" id="duo-prompt">Übersetze: „Guten Morgen“</h2>
        <p class="settings-item-sub" id="duo-hint" style="margin-bottom:14px;">Wähle die passende Antwort aus.</p>
        <div style="display:flex;flex-direction:column;gap:10px;" id="duo-options"></div>
        <div id="duo-feedback" style="margin-top:14px;font-weight:700;font-size:14px;"></div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:14px;">
          <button type="button" class="m3-btn m3-btn-tonal" onclick="refillHearts()">Herzen auffüllen</button>
          <button type="button" class="m3-btn" id="duo-next-btn" onclick="nextQuestion()">Nächste Aufgabe</button>
        </div>
      </div>
    </main>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();

    const LESSONS = {
      es: [
        { q: 'Übersetze: „Guten Morgen“', hint: 'Tageszeit am Morgen', opts: ['Buenos días', 'Buenas noches', 'Gracias', 'Adiós'], ans: 0 },
        { q: 'Was bedeutet „Agua“?', hint: 'Alltagswortschatz', opts: ['Brot', 'Wasser', 'Apfel', 'Haus'], ans: 1 },
        { q: 'Vervollständige: „Yo ____ café.“', hint: 'Verb: tomar (ich nehme/trinke)', opts: ['como', 'hablo', 'tomo', 'vivo'], ans: 2 }
      ],
      fr: [
        { q: 'Übersetze: „Danke schön“', hint: 'Höflichkeit im Alltag', opts: ['Bonjour', 'Merci beaucoup', 'Au revoir', 'Pardon'], ans: 1 },
        { q: 'Was bedeutet „Le chat“?', hint: 'Tierwelt', opts: ['Der Hund', 'Der Vogel', 'Die Katze', 'Das Buch'], ans: 2 },
        { q: 'Übersetze: „Ich heiße…“', hint: 'Vorstellung', opts: ['Je m’appelle…', 'J’ai faim…', 'Je suis ici…', 'Je veux…'], ans: 0 }
      ],
      ja: [
        { q: 'Was bedeutet „Arigatō“?', hint: 'Freundlicher Dank', opts: ['Hallo', 'Danke', 'Tschüss', 'Entschuldigung'], ans: 1 },
        { q: 'Übersetze: „Guten Tag“', hint: 'Begrüßung tagsüber', opts: ['Konnichiwa', 'Ohayō', 'Sayōnara', 'Oyasumi'], ans: 0 },
        { q: 'Was bedeutet „Mizu“?', hint: 'Getränk', opts: ['Tee', 'Reis', 'Wasser', 'Fisch'], ans: 2 }
      ]
    };

    let duoLang = 'es';
    let qIndex = 0;
    let answered = false;

    function getDuoStats() {
      const st = AndroidOS.getState();
      return st.duolingo || { xp: 40, streak: 3, hearts: 5 };
    }

    function setDuoLang(l) {
      duoLang = l;
      qIndex = 0;
      answered = false;
      document.querySelectorAll('#duo-lang-chips .m3-chip').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
      renderDuo();
    }

    function refillHearts() {
      AndroidOS.updateState(s => {
        s.duolingo = { ...(s.duolingo || getDuoStats()), hearts: 5 };
      });
      AndroidOS.showToast('Alle 5 Herzen wiederhergestellt!');
      renderDuo();
    }

    function chooseOption(idx, btnEl) {
      if (answered) return;
      answered = true;
      const list = LESSONS[duoLang] || LESSONS.es;
      const item = list[qIndex % list.length];
      const fb = document.getElementById('duo-feedback');
      const allBtns = Array.from(document.querySelectorAll('#duo-options .duo-option'));
      allBtns.forEach((b, i) => {
        if (i === item.ans) b.classList.add('correct');
      });

      if (idx === item.ans) {
        btnEl.classList.add('correct');
        fb.style.color = '#2D6A4F';
        fb.textContent = 'Richtig! +15 XP erhalten.';
        AndroidOS.updateState(s => {
          const cur = s.duolingo || getDuoStats();
          s.duolingo = {
            ...cur,
            xp: (cur.xp || 0) + 15,
            streak: Math.max(1, (cur.streak || 0) + (qIndex === 0 ? 1 : 0))
          };
        });
      } else {
        btnEl.classList.add('wrong');
        fb.style.color = '#BA1A1A';
        fb.textContent = `Nicht ganz – richtig ist: „${item.opts[item.ans]}“.`;
        AndroidOS.updateState(s => {
          const cur = s.duolingo || getDuoStats();
          s.duolingo = {
            ...cur,
            hearts: Math.max(0, (cur.hearts ?? 5) - 1)
          };
        });
      }
      renderStatsOnly();
    }

    function nextQuestion() {
      const list = LESSONS[duoLang] || LESSONS.es;
      qIndex = (qIndex + 1) % list.length;
      answered = false;
      renderDuo();
    }

    function renderStatsOnly() {
      const d = getDuoStats();
      document.getElementById('duo-streak').textContent = `${d.streak || 0} Tage`;
      document.getElementById('duo-xp').textContent = `${d.xp || 0} XP`;
      document.getElementById('duo-hearts').textContent = `${d.hearts ?? 5}`;
    }

    function renderDuo() {
      renderStatsOnly();
      const list = LESSONS[duoLang] || LESSONS.es;
      const item = list[qIndex % list.length];
      const langNames = { es: 'Spanisch', fr: 'Französisch', ja: 'Japanisch' };
      document.getElementById('duo-q-badge').textContent = `Aufgabe ${(qIndex % list.length) + 1} / ${list.length}`;
      document.getElementById('duo-sub-lang').textContent = `${langNames[duoLang] || 'Sprache'} · Mini-Lektion`;
      document.getElementById('duo-prompt').textContent = item.q;
      document.getElementById('duo-hint').textContent = item.hint;
      document.getElementById('duo-feedback').textContent = '';

      const optsEl = document.getElementById('duo-options');
      optsEl.innerHTML = '';
      item.opts.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'duo-option';
        btn.textContent = opt;
        btn.addEventListener('click', () => chooseOption(i, btn));
        optsEl.appendChild(btn);
      });
    }

    renderDuo();
  </script>
</body>
</html>
