<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wetter – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <header class="app-topbar">
      <div class="app-title-group">
        <a href="start.html" class="icon-btn" title="Startbildschirm">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <h1 style="font-size:22px;font-weight:700;">Wetter</h1>
          <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">Aktuelle Vorhersage</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="m3-chip active" onclick="selectCity('Nordhorn', 11, 'Heiter bis wolkig', 'Luftfeuchtigkeit 62 % · Wind 14 km/h', this)">Nordhorn</button>
        <button class="m3-chip" onclick="selectCity('Mönchengladbach', 12, 'Leicht bewölkt', 'Luftfeuchtigkeit 58 % · Wind 11 km/h', this)">Mönchengladbach</button>
        <button class="m3-chip" onclick="selectCity('Berlin', 9, 'Klar & frisch', 'Luftfeuchtigkeit 54 % · Wind 16 km/h', this)">Berlin</button>
      </div>
    </header>

    <main class="app-main">
      <div class="m3-card-filled" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px;">
        <div>
          <div id="w-city" style="font-size:16px;font-weight:700;color:var(--md-sys-color-primary);">Nordhorn</div>
          <div id="w-temp" style="font-size:64px;font-weight:700;line-height:1.05;">11 °C</div>
          <div id="w-desc" style="font-size:16px;font-weight:600;margin-top:4px;">Heiter bis wolkig</div>
        </div>
        <div class="m3-card" style="max-width:340px;">
          <div style="display:flex;align-items:center;gap:8px;font-weight:700;color:var(--md-sys-color-primary);margin-bottom:6px;">
            <span class="material-symbols-rounded filled">air</span>
            <span>Wetterdetails</span>
          </div>
          <p id="w-detail" style="font-size:14px;color:var(--md-sys-color-on-surface-variant);line-height:1.45;">
            Luftfeuchtigkeit 62 % · Wind 14 km/h aus Südwest.
          </p>
        </div>
      </div>

      <h2 style="font-size:18px;margin-bottom:8px;">4-Tage-Vorschau</h2>
      <div class="forecast-grid">
        <div class="m3-card" style="text-align:center;">
          <div style="font-weight:700;margin-bottom:8px;">Heute</div>
          <span class="material-symbols-rounded filled" style="font-size:32px;color:var(--md-sys-color-primary);">partly_cloudy_day</span>
          <div style="font-size:20px;font-weight:700;margin-top:8px;">11° / 5°</div>
        </div>
        <div class="m3-card" style="text-align:center;">
          <div style="font-weight:700;margin-bottom:8px;">Morgen</div>
          <span class="material-symbols-rounded filled" style="font-size:32px;color:var(--md-sys-color-primary);">rainy</span>
          <div style="font-size:20px;font-weight:700;margin-top:8px;">9° / 4°</div>
        </div>
        <div class="m3-card" style="text-align:center;">
          <div style="font-weight:700;margin-bottom:8px;">Dienstag</div>
          <span class="material-symbols-rounded filled" style="font-size:32px;color:var(--md-sys-color-primary);">wb_sunny</span>
          <div style="font-size:20px;font-weight:700;margin-top:8px;">12° / 4°</div>
        </div>
        <div class="m3-card" style="text-align:center;">
          <div style="font-weight:700;margin-bottom:8px;">Mittwoch</div>
          <span class="material-symbols-rounded filled" style="font-size:32px;color:var(--md-sys-color-primary);">cloud</span>
          <div style="font-size:20px;font-weight:700;margin-top:8px;">10° / 6°</div>
        </div>
      </div>
    </main>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();
    function selectCity(city, temp, desc, detail, btn) {
      document.querySelectorAll('.app-topbar .m3-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('w-city').textContent = city;
      document.getElementById('w-temp').textContent = temp + ' °C';
      document.getElementById('w-desc').textContent = desc;
      document.getElementById('w-detail').textContent = detail;
    }
  </script>
</body>
</html>
