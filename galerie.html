<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .gal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .gal-thumb {
      height: 165px;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      color: #fff;
    }
    .gal-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <header class="app-topbar">
      <div class="app-title-group">
        <a href="start.html" class="icon-btn" title="Start">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <h1 style="font-size:21px;font-weight:700;">Galerie</h1>
          <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">Aufgenommene & gespeicherte Fotos</div>
        </div>
      </div>
      <a href="kamera.html" class="m3-btn">Kamera</a>
    </header>

    <main class="app-main">
      <div class="gal-grid" id="gal-grid"></div>
    </main>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();
    function renderGallery() {
      const items = AndroidOS.getState().gallery || [];
      document.getElementById('gal-grid').innerHTML = items.map(it => `
        <div class="m3-card">
          <div class="gal-thumb" style="${it.imageData ? '' : `background:linear-gradient(135deg, ${it.color1}, ${it.color2});`}">
            ${it.imageData
              ? `<img src="${it.imageData}" alt="${it.title}">`
              : `<span class="material-symbols-rounded filled" style="font-size:48px;">${it.icon || 'photo'}</span>`
            }
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <div>
              <div style="font-size:11px;font-weight:700;color:var(--md-sys-color-primary);">${it.tag || 'Foto'}</div>
              <div style="font-weight:700;font-size:15px;">${it.title}</div>
            </div>
            <button class="icon-btn" onclick="deletePhoto('${it.id}')" title="Löschen">
              <span class="material-symbols-rounded" style="font-size:18px;">delete</span>
            </button>
          </div>
        </div>
      `).join('');
    }
    function deletePhoto(id) {
      AndroidOS.updateState(s => {
        s.gallery = (s.gallery || []).filter(x => x.id !== id);
      });
      renderGallery();
    }
    renderGallery();
  </script>
</body>
</html>
