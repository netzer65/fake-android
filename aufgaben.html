<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aufgaben – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-radius: 18px;
      background: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      margin-bottom: 10px;
      cursor: pointer;
    }
    .task-item.done {
      opacity: 0.55;
      text-decoration: line-through;
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <header class="app-topbar">
      <div class="app-title-group">
        <a href="start.html" class="icon-btn" title="Startbildschirm">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <h1 style="font-size:22px;font-weight:700;">Aufgaben</h1>
          <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">To-Dos & Checklisten</div>
        </div>
      </div>
      <button class="m3-btn m3-btn-tonal" style="padding:10px 14px;" onclick="clearDone()">
        <span>Erledigte löschen</span>
      </button>
    </header>

    <main class="app-main">
      <div style="display:flex;gap:10px;margin-bottom:18px;">
        <input type="text" id="task-input" class="m3-input" placeholder="Neue Aufgabe hinzufügen…">
        <button class="m3-btn" onclick="addItem()">
          <span class="material-symbols-rounded">add</span>
        </button>
      </div>

      <div id="task-list"></div>
    </main>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();

    function addItem() {
      const inp = document.getElementById('task-input');
      const text = inp.value.trim();
      if (!text) return;
      AndroidOS.updateState(s => {
        s.tasks.unshift({ id: 's_' + Date.now(), text, done: false });
      });
      inp.value = '';
      renderList();
    }

    function toggleItem(id) {
      AndroidOS.updateState(s => {
        const it = s.tasks.find(x => x.id === id);
        if (it) it.done = !it.done;
      });
      renderList();
    }

    function removeItem(id) {
      AndroidOS.updateState(s => {
        s.tasks = s.tasks.filter(x => x.id !== id);
      });
      renderList();
    }

    function clearDone() {
      AndroidOS.updateState(s => {
        s.tasks = s.tasks.filter(x => !x.done);
      });
      renderList();
    }

    function renderList() {
      const items = AndroidOS.getState().tasks || [];
      document.getElementById('task-list').innerHTML = items.map(it => `
        <div class="task-item ${it.done ? 'done' : ''}" onclick="toggleItem('${it.id}')">
          <div style="display:flex;align-items:center;gap:12px;">
            <span class="material-symbols-rounded ${it.done ? 'filled' : ''}" style="color:var(--md-sys-color-primary);">
              ${it.done ? 'check_circle' : 'radio_button_unchecked'}
            </span>
            <span style="font-weight:500;">${it.text}</span>
          </div>
          <button class="icon-btn" style="width:34px;height:34px;" onclick="event.stopPropagation();removeItem('${it.id}')">
            <span class="material-symbols-rounded" style="font-size:18px;">close</span>
          </button>
        </div>
      `).join('');
    }

    document.getElementById('task-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') addItem();
    });
    renderList();
  </script>
</body>
</html>
