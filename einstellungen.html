<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Einstellungen – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .settings-wrap {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 20px 64px;
    }
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .settings-title {
      font-size: clamp(24px, 4.5vw, 32px);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .search-box {
      position: relative;
      margin-bottom: 16px;
    }
    .search-box .material-symbols-rounded {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--md-sys-color-on-surface-variant);
    }
    .search-input {
      width: 100%;
      padding: 13px 16px 13px 44px;
      border-radius: 999px;
      border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      font-family: var(--font-sans);
      font-size: 14px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--md-sys-color-primary);
    }
    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 20px;
      background: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      cursor: pointer;
      text-align: left;
      width: 100%;
      font-family: var(--font-sans);
      color: var(--md-sys-color-on-surface);
      transition: background 0.18s ease, transform 0.15s ease;
    }
    .setting-row:hover {
      background: var(--md-sys-color-surface-container);
    }
    .setting-row.active-panel {
      border-color: var(--md-sys-color-primary);
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }
    .setting-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .setting-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .setting-label {
      font-size: 15px;
      font-weight: 600;
    }
    .setting-sub {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .detail-panel {
      margin-top: 16px;
      padding: 18px;
      border-radius: 24px;
      background: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .mini-card {
      padding: 12px;
      border-radius: 16px;
      background: var(--md-sys-color-surface-container-low);
      border: 1.5px solid var(--md-sys-color-outline-variant);
      cursor: pointer;
      font-family: var(--font-sans);
      color: var(--md-sys-color-on-surface);
      text-align: left;
    }
    .mini-card.selected {
      border-color: var(--md-sys-color-primary);
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }
    .inline-switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--md-sys-color-surface-container-low);
      margin-bottom: 10px;
    }
    .storage-bar {
      height: 10px;
      border-radius: 999px;
      background: var(--md-sys-color-surface-container-highest);
      overflow: hidden;
      margin: 10px 0 6px;
    }
    .storage-fill {
      height: 100%;
      background: var(--md-sys-color-primary);
      border-radius: 999px;
    }
    .danger-btn {
      background: var(--md-sys-color-error);
      color: var(--md-sys-color-on-error);
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>

    <main class="settings-wrap">
      <div class="settings-header">
        <div>
          <h1 class="settings-title" id="st-heading">Einstellungen</h1>
          <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);" id="st-device-meta"></div>
        </div>
        <a href="start.html" class="icon-btn" title="Startbildschirm">
          <span class="material-symbols-rounded">home</span>
        </a>
      </div>

      <div class="search-box">
        <span class="material-symbols-rounded">search</span>
        <input type="text" id="settings-search" class="search-input" placeholder="Einstellungen durchsuchen">
      </div>

      <div class="settings-list" id="settings-list"></div>

      <div class="detail-panel" id="detail-panel" style="display:none;"></div>
    </main>

    <div id="sys-gesture-nav" class="gesture-nav"></div>
  </div>

  <script src="system.js"></script>
  <script>
    AndroidOS.requireUnlocked(true);
    AndroidOS.mountShell({ showGestureBar: true });

    let activeCategory = null;
    let searchQuery = '';

    function getCategories() {
      const st = AndroidOS.getState();
      const bat = AndroidOS.getBatteryInfo(st);
      const ga = st.googleAccount || {};
      const fl = st.familyLink || {};

      return [
        {
          id: 'network',
          icon: 'wifi',
          title: AndroidOS.t('netTitle', st),
          sub: `${AndroidOS.t('netSub', st)} · ${st.wifi ? (st.wifiNetwork || 'WLAN') : 'WLAN aus'}`,
          keywords: 'netzwerk internet wlan wifi mobilfunk mobile hotspot 5g'
        },
        {
          id: 'connected',
          icon: 'devices_other',
          title: AndroidOS.t('connTitle', st),
          sub: `${AndroidOS.t('connSub', st)} · Bluetooth ${st.bluetooth ? 'An' : 'Aus'}`,
          keywords: 'verbundene geraete bluetooth koppeln audio'
        },
        {
          id: 'apps',
          icon: 'apps',
          title: AndroidOS.t('appsTitle', st),
          sub: AndroidOS.t('appsSub', st),
          keywords: 'apps anwendungen zuletzt geoeffnete standard apps'
        },
        {
          id: 'notifications',
          icon: 'notifications',
          title: AndroidOS.t('notifTitle', st),
          sub: AndroidOS.t('notifSub', st),
          keywords: 'benachrichtigungen verlauf unterhaltungen meldungen'
        },
        {
          id: 'sound',
          icon: 'volume_up',
          title: AndroidOS.t('soundTitle', st),
          sub: `${st.silent ? 'Lautlos' : `Lautstärke ${st.volume ?? 75}%`} · Haptik ${st.haptics !== false ? 'An' : 'Aus'}`,
          keywords: 'ton vibration lautstaerke lautlos stumm haptik'
        },
        {
          id: 'modes',
          icon: 'bedtime',
          title: AndroidOS.t('modesTitle', st),
          sub: `${AndroidOS.t('modesSub', st)} · DND ${st.dnd ? 'An' : 'Aus'}`,
          keywords: 'modi nicht stören dnd nachtruhe fahren'
        },
        {
          id: 'display',
          icon: 'brightness_6',
          title: AndroidOS.t('displayTitle', st),
          sub: `${st.mode === 'dark' ? 'Dunkelmodus' : 'Hellmodus'} · Helligkeit ${st.brightness || 100}%`,
          keywords: 'display touch helligkeit dunkelmodus hellmodus'
        },
        {
          id: 'style',
          icon: 'palette',
          title: AndroidOS.t('styleTitle', st),
          sub: `${AndroidOS.t('styleSub', st)} · ${st.theme || 'ocean'}`,
          keywords: 'hintergrundbild stil farben design theme ocean forest violet amber lagoon rose'
        },
        {
          id: 'battery',
          icon: bat.charging ? 'battery_charging_full' : 'battery_full',
          title: AndroidOS.t('batteryTitle', st),
          sub: AndroidOS.t('batterySub', st, bat.level, bat.charging),
          keywords: 'akku batterie laden energie stromsparmodus'
        },
        {
          id: 'account',
          icon: 'account_circle',
          title: AndroidOS.t('accountTitle', st),
          sub: AndroidOS.t('accountSub', st, ga.name || st.userName || 'Guest', ga.email || 'guest.user@example.com'),
          keywords: 'google konto account profil synchronisierung drive fotos kontakte speicher'
        },
        {
          id: 'family',
          icon: 'family_restroom',
          title: AndroidOS.t('familyTitle', st),
          sub: AndroidOS.t('familySub', st, fl.enabled !== false, fl.dailyLimitMinutes || 180),
          keywords: 'family link eltern bildschirmzeit tageslimit nachtruhe app limits'
        },
        {
          id: 'system',
          icon: 'settings_suggest',
          title: AndroidOS.t('systemTitle', st),
          sub: `${st.language.toUpperCase()} · ${st.region || 'DE'} · OSK ${st.oskEnabled ? 'An' : 'Aus'}`,
          keywords: 'system sprache region pin tastatur osk gboard backup json export import neustart ausschalten werksreset'
        }
      ];
    }

    function renderList() {
      const st = AndroidOS.getState();
      document.getElementById('st-heading').textContent = AndroidOS.t('settings', st);
      document.getElementById('st-device-meta').textContent = `${st.deviceName || 'Pixel 10'} · ${st.userName || 'Guest'} · ${st.language.toUpperCase()} (${st.region || 'DE'})`;
      document.getElementById('settings-search').placeholder = AndroidOS.t('searchSettings', st);

      const q = searchQuery.trim().toLowerCase();
      const cats = getCategories().filter(c => {
        if (!q) return true;
        return (
          c.title.toLowerCase().includes(q) ||
          c.sub.toLowerCase().includes(q) ||
          c.keywords.toLowerCase().includes(q)
        );
      });

      const listEl = document.getElementById('settings-list');
      listEl.innerHTML = cats.map(c => `
        <button type="button" class="setting-row ${activeCategory === c.id ? 'active-panel' : ''}" data-cat="${c.id}">
          <span class="setting-left">
            <span class="setting-icon">
              <span class="material-symbols-rounded">${c.icon}</span>
            </span>
            <span style="min-width:0;">
              <span class="setting-label" style="display:block;">${c.title}</span>
              <span class="setting-sub" style="display:block;">${c.sub}</span>
            </span>
          </span>
          <span class="material-symbols-rounded" style="opacity:0.7;">${activeCategory === c.id ? 'expand_less' : 'chevron_right'}</span>
        </button>
      `).join('');

      listEl.querySelectorAll('.setting-row').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.cat;
          activeCategory = activeCategory === id ? null : id;
          renderList();
          renderDetailPanel();
        });
      });
    }

    function renderDetailPanel() {
      const panel = document.getElementById('detail-panel');
      if (!activeCategory) {
        panel.style.display = 'none';
        panel.innerHTML = '';
        return;
      }

      const st = AndroidOS.getState();
      panel.style.display = 'block';

      if (activeCategory === 'network') {
        panel.innerHTML = `
          <h2 style="font-size:18px;font-weight:700;margin-bottom:12px;">${AndroidOS.t('netTitle', st)}</h2>
          <div class="inline-switch-row">
            <div>
              <div style="font-weight:700;">WLAN</div>
              <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">Aktives Netzwerk: ${st.wifiNetwork || 'Pixel-Home-5G'}</div>
            </div>
            <button type="button" class="m3-chip ${st.wifi ? 'active' : ''}" id="act-wifi">${st.wifi ? 'An' : 'Aus'}</button>
          </div>
          <div style="margin-bottom:12px;">
            <label style="font-size:11px;font-weight:700;display:block;margin-bottom:5px;">WLAN-SSID</label>
            <div style="display:flex;gap:8px;">
              <input type="text" id="in-wifi-ssid" class="m3-input" value="${st.wifiNetwork || 'Pixel-Home-5G'}">
              <button type="button" class="m3-btn" id="save-wifi-ssid">Speichern</button>
            </div>
          </div>
          <div class="inline-switch-row">
            <div>
              <div style="font-weight:700;">Mobile Daten (5G)</div>
              <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">Mobilfunkverbindung nutzen</div>
            </div>
            <button type="button" class="m3-chip ${st.mobileData ? 'active' : ''}" id="act-mobile">${st.mobileData ? 'An' : 'Aus'}</button>
          </div>
        `;
        document.getElementById('act-wifi').onclick = () => {
          AndroidOS.updateState(s => { s.wifi = !s.wifi; });
          renderAll();
        };
        document.getElementById('save-wifi-ssid').onclick = () => {
          const val = document.getElementById('in-wifi-ssid').value.trim() || 'Pixel-Home-5G';
          AndroidOS.updateState(s => { s.wifiNetwork = val; });
          AndroidOS.showToast(AndroidOS.t('saved'));
          renderAll();
        };
        document.getElementById('act-mobile').onclick = () => {
          AndroidOS.updateState(s => { s.mobileData = !s.mobileData; });
          renderAll();
        };
        return;
      }

      if (activeCategory === 'connected') {
        panel.innerHTML = `
          <h2 style="font-size:18px;font-weight:700;margin-bottom:12px;">${AndroidOS.t('connTitle', st)}</h2>
          <div class="inline-switch-row">
            <div>
              <div style="font-weight:700;">Bluetooth</div>
              <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">Kopfhörer, Tastaturen & Geräte</div>
            </div>
            <button type="button" class="m3-chip ${st.bluetooth ? 'active' : ''}" id="act-bt">${st.bluetooth ? 'An' : 'Aus'}</button>
          </div>
          <div class="detail-grid">
            <div class="mini-card"><div style="font-weight:700;">Pixel Buds Pro</div><div style="font-size:12px;opacity:0.75;">Audio · Bereit</div></div>
            <div class="mini-card"><div style="font-weight:700;">Surface Type Cover</div><div style="font-size:12px;opacity:0.75;">Eingabe · Bereit</div></div>
          </div>
        `;
        document.getElementById('act-bt').onclick = () => {
          AndroidOS.updateState(s => { s.bluetooth = !s.bluetooth; });
          renderAll();
        };
        return;
      }

      if (activeCategory === 'apps') {
        panel.innerHTML = `
          <h2 style="font-size:18px;font-weight:700;margin-bottom:10px;">${AndroidOS.t('appsTitle', st)}</h2>
          <p style="font-size:13px;color:var(--md-sys-color-on-surface-variant);margin-bottom:12px;">Installierte System-Apps im Android 16 Launcher:</p>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            <a href="start.html" class="m3-chip">Startbildschirm</a>
            <a href="rechner.html" class="m3-chip">Rechner</a>
            <a href="kamera.html" class="m3-chip">Kamera</a>
            <a href="notizen.html" class="m3-chip">Notizen</a>
            <a href="uhr.html" class="m3-chip">Uhr</a>
            <a href="musik.html" class="m3-chip">Musik</a>
            <a href="kontakte.html" class="m3-chip">Kontakte</a>
            <a href="galerie.html" class="m3-chip">Galerie</a>
          </div>
        `;
        return;
      }

      if (activeCategory === 'notifications') {
        panel.innerHTML = `
          <h2 style="font-size:18px;font-weight:700;margin-bottom:10px;">${AndroidOS.t('notifTitle', st)}</h2>
          <div class="inline-switch-row">
            <div>
              <div style="font-weight:700;">Nicht stören</div>
              <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">Mitteilungen und Banner dämpfen</div>
            </div>
            <button type="button" class="m3-chip ${st.dnd ? 'active' : ''}" id="act-notif-dnd">${st.dnd ? 'An' : 'Aus'}</button>
          </div>
          <p style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">Aktive Timer erscheinen als Live-Badge in der Statusleiste und in der Dynamic Island.</p>
        `;
        document.getElementById('act-notif-dnd').onclick = () => {
          AndroidOS.updateState(s => { s.dnd = !s.dnd; });
          renderAll();
        };
        return;
      }

      if (activeCategory === 'sound') {
        const vol = st.silent ? 0 : (st.volume ?? 75);
        panel.innerHTML = `
          <h2 style="font-size:18px;font-weight:700;margin-bottom:12px;">${AndroidOS.t('soundTitle', st)}</h2>
          <div class="inline-switch-row">
            <div>
              <div style="font-weight:700;">Lautlos</div>
              <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">Alle System- und Benachrichtigungstöne stummschalten</div>
            </div>
            <button type="button" class="m3-chip ${st.silent ? 'active' : ''}" id="act-silent">${st.silent ? 'An' : 'Aus'}</button>
          </div>
          <div style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px;">
              <span>Lautstärke</span>
              <span>${st.silent ? 'Lautlos (0%)' : `${vol}%`}</span>
            </div>
            <input type="range" id="in-vol" min="0" max="100" value="${vol}" style="width:100%;accent-color:var(--md-sys-color-primary);">
          </div>
          <div class="inline-switch-row">
            <div>
              <div style="font-weight:700;">Touch-Haptik</div>
              <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">Tastatur- und Gestenfeedback</div>
            </div>
            <button type="button" class="m3-chip ${st.haptics !== false ? 'active' : ''}" id="act-haptics">${st.haptics !== false ? 'An' : 'Aus'}</button>
          </div>
        `;
        document.getElementById('act-silent').onclick = () => {
          AndroidOS.updateState(s => {
            s.silent = !s.silent;
            if (!s.silent && (s.volume === 0 || s.volume === undefined)) s.volume = 60;
          });
          renderAll();
        };
        document.getElementById('in-vol').oninput = (e) => {
          const val = Number(e.target.value);
          AndroidOS.updateState(s => {
            s.volume = val;
            s.silent = val === 0;
          });
          renderAll();
        };
        document.getElementById('act-haptics').onclick = () => {
          AndroidOS.updateState(s => { s.haptics = s.haptics === false ? true : false; });
          renderAll();
        };
        return;
      }

      if (activeCategory === 'modes') {
        const fl = st.familyLink || {};
        panel.innerHTML = `
          <h2 style="font-size:18px;font-weight:700;margin-bottom:12px;">${AndroidOS.t('modesTitle', st)}</h2>
          <div class="inline-switch-row">
            <div>
              <div style="font-weight:700;">Nicht stören</div>
              <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">Fokus-Modus ohne Unterbrechungen</div>
            </div>
            <button type="button" class="m3-chip ${st.dnd ? 'active' : ''}" id="act-mode-dnd">${st.dnd ? 'An' : 'Aus'}</button>
          </div>
          <div class="inline-switch-row">
            <div>
              <div style="font-weight:700;">Nachtruhe</div>
              <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">Geplant ${fl.bedtimeStart || '22:00'} – ${fl.bedtimeEnd || '07:00'}</div>
            </div>
            <button type="button" class="m3-chip ${fl.bedtimeEnabled ? 'active' : ''}" id="act-mode-bed">${fl.bedtimeEnabled ? 'An' : 'Aus'}</button>
          </div>
        `;
        document.getElementById('act-mode-dnd').onclick = () => {
          AndroidOS.updateState(s => { s.dnd = !s.dnd; });
          renderAll();
        };
        document.getElementById('act-mode-bed').onclick = () => {
          AndroidOS.updateState(s => {
            s.familyLink = { ...(s.familyLink || {}), bedtimeEnabled: !(s.familyLink && s.familyLink.bedtimeEnabled) };
          });
          renderAll();
        };
        return;
      }

      if (activeCategory === 'display') {
        panel.innerHTML = `
          <h2 style="font-size:18px;font-weight:700;margin-bottom:12px;">${AndroidOS.t('displayTitle', st)}</h2>
          <div class="detail-grid" style="grid-template-columns:1fr 1fr;margin-bottom:14px;">
            <button type="button" class="mini-card ${st.mode === 'light' ? 'selected' : ''}" id="mode-l">Hellmodus</button>
            <button type="button" class="mini-card ${st.mode === 'dark' ? 'selected' : ''}" id="mode-d">Dunkelmodus</button>
          </div>
          <div>
            <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px;">
              <span>Helligkeit</span>
              <span>${st.brightness || 100}%</span>
            </div>
            <input type="range" id="in-bright" min="45" max="100" value="${st.brightness || 100}" style="width:100%;accent-color:var(--md-sys-color-primary);">
          </div>
        `;
        document.getElementById('mode-l').onclick = () => { AndroidOS.updateState(s => { s.mode = 'light'; }); renderAll(); };
        document.getElementById('mode-d').onclick = () => { AndroidOS.updateState(s => { s.mode = 'dark'; }); renderAll(); };
        document.getElementById('in-bright').oninput = (e) => {
          AndroidOS.updateState(s => { s.brightness = Number(e.target.value); });
          renderAll();
        };
        return;
      }

      if (activeCategory === 'style') {
        const themes = ['ocean', 'forest', 'violet', 'amber', 'lagoon', 'rose'];
        panel.innerHTML = `
          <h2 style="font-size:18px;font-weight:700;margin-bottom:10px;">${AndroidOS.t('styleTitle', st)}</h2>
          <div class="detail-grid">
            ${themes.map(th => `
              <button type="button" class="mini-card ${st.theme === th ? 'selected' : ''}" data-th="${th}" style="text-transform:capitalize;font-weight:700;">${th}</button>
            `).join('')}
          </div>
        `;
        panel.querySelectorAll('[data-th]').forEach(btn => {
          btn.onclick = () => {
            AndroidOS.updateState(s => { s.theme = btn.dataset.th; });
            renderAll();
          };
        });
        return;
      }

      if (activeCategory === 'battery') {
        const bat = AndroidOS.getBatteryInfo(st);
        panel.innerHTML = `
          <h2 style="font-size:18px;font-weight:700;margin-bottom:8px;">${AndroidOS.t('batteryTitle', st)}</h2>
          <p style="font-size:14px;font-weight:600;margin-bottom:12px;">${AndroidOS.t('batterySub', st, bat.level, bat.charging)}</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" class="m3-chip" id="sim-charge">Ladezustand umschalten</button>
            <button type="button" class="m3-chip" id="sim-lvl">-10% Akku</button>
          </div>
        `;
        document.getElementById('sim-charge').onclick = () => {
          AndroidOS.updateState(s => { s.batteryCharging = !s.batteryCharging; });
          renderAll();
        };
        document.getElementById('sim-lvl').onclick = () => {
          AndroidOS.updateState(s => { s.batteryLevel = s.batteryLevel > 15 ? s.batteryLevel - 10 : 94; });
          renderAll();
        };
        return;
      }

      if (activeCategory === 'account') {
        const ga = st.googleAccount || {};
        const used = Number(ga.storageUsedGb ?? 18.4);
        const total = Number(ga.storageTotalGb ?? 100);
        const pct = Math.min(100, Math.max(2, Math.round((used / total) * 100)));
        panel.innerHTML = `
          <h2 style="font-size:18px;font-weight:700;margin-bottom:12px;">${AndroidOS.t('accountTitle', st)}</h2>
          <div class="inline-switch-row">
            <div>
              <div style="font-weight:700;">Angemeldetes Konto</div>
              <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">${ga.email || 'guest.user@example.com'}</div>
            </div>
            <button type="button" class="m3-chip ${ga.signedIn !== false ? 'active' : ''}" id="act-ga-sign">${ga.signedIn !== false ? 'Aktiv' : 'Abgemeldet'}</button>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
            <div>
              <label style="font-size:11px;font-weight:700;display:block;margin-bottom:4px;">NAME</label>
              <input type="text" id="in-ga-name" class="m3-input" value="${ga.name || st.userName || 'Guest User'}">
            </div>
            <div>
              <label style="font-size:11px;font-weight:700;display:block;margin-bottom:4px;">E-MAIL</label>
              <input type="email" id="in-ga-email" class="m3-input" value="${ga.email || 'guest.user@example.com'}">
            </div>
          </div>
          <button type="button" class="m3-btn" id="save-ga" style="margin-bottom:14px;">Konto speichern</button>
          <div class="inline-switch-row">
            <span>Google Drive synchronisieren</span>
            <button type="button" class="m3-chip ${ga.syncDrive !== false ? 'active' : ''}" id="act-sync-drive">${ga.syncDrive !== false ? 'An' : 'Aus'}</button>
          </div>
          <div class="inline-switch-row">
            <span>Google Fotos sichern</span>
            <button type="button" class="m3-chip ${ga.syncPhotos !== false ? 'active' : ''}" id="act-sync-photos">${ga.syncPhotos !== false ? 'An' : 'Aus'}</button>
          </div>
          <div style="margin-top:12px;">
            <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;">
              <span>Cloud-Speicher</span>
              <span>${used} GB von ${total} GB (${pct}%)</span>
            </div>
            <div class="storage-bar"><div class="storage-fill" style="width:${pct}%;"></div></div>
          </div>
        `;
        document.getElementById('act-ga-sign').onclick = () => {
          AndroidOS.updateState(s => { s.googleAccount = { ...(s.googleAccount || {}), signedIn: !(s.googleAccount && s.googleAccount.signedIn !== false) }; });
          renderAll();
        };
        document.getElementById('save-ga').onclick = () => {
          const n = document.getElementById('in-ga-name').value.trim() || 'Guest User';
          const em = document.getElementById('in-ga-email').value.trim() || 'guest.user@example.com';
          AndroidOS.updateState(s => {
            s.userName = n;
            s.googleAccount = { ...(s.googleAccount || {}), name: n, email: em };
          });
          AndroidOS.showToast(AndroidOS.t('saved'));
          renderAll();
        };
        document.getElementById('act-sync-drive').onclick = () => {
          AndroidOS.updateState(s => { s.googleAccount = { ...(s.googleAccount || {}), syncDrive: !(s.googleAccount && s.googleAccount.syncDrive !== false) }; });
          renderAll();
        };
        document.getElementById('act-sync-photos').onclick = () => {
          AndroidOS.updateState(s => { s.googleAccount = { ...(s.googleAccount || {}), syncPhotos: !(s.googleAccount && s.googleAccount.syncPhotos !== false) }; });
          renderAll();
        };
        return;
      }

      if (activeCategory === 'family') {
        const fl = st.familyLink || {};
        const limit = Number(fl.dailyLimitMinutes || 180);
        const used = Number(fl.usedMinutesToday || 42);
        panel.innerHTML = `
          <h2 style="font-size:18px;font-weight:700;margin-bottom:12px;">${AndroidOS.t('familyTitle', st)}</h2>
          <div class="inline-switch-row">
            <div>
              <div style="font-weight:700;">Family Link Aufsicht</div>
              <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">Verwaltet durch ${fl.parentName || 'Alex Morgan'} (${fl.parentEmail || 'parent.family@example.com'})</div>
            </div>
            <button type="button" class="m3-chip ${fl.enabled !== false ? 'active' : ''}" id="act-fl-on">${fl.enabled !== false ? 'Aktiv' : 'Aus'}</button>
          </div>
          <div style="margin:12px 0;">
            <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px;">
              <span>Tägliches Bildschirmzeitlimit</span>
              <span>${limit} Min. (Heute: ${used} Min.)</span>
            </div>
            <input type="range" id="in-fl-limit" min="30" max="360" step="15" value="${limit}" style="width:100%;accent-color:var(--md-sys-color-primary);">
          </div>
          <div class="inline-switch-row">
            <div>
              <div style="font-weight:700;">Nachtruhe-Sperre</div>
              <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">${fl.bedtimeStart || '22:00'} bis ${fl.bedtimeEnd || '07:00'}</div>
            </div>
            <button type="button" class="m3-chip ${fl.bedtimeEnabled ? 'active' : ''}" id="act-fl-bed">${fl.bedtimeEnabled ? 'An' : 'Aus'}</button>
          </div>
        `;
        document.getElementById('act-fl-on').onclick = () => {
          AndroidOS.updateState(s => { s.familyLink = { ...(s.familyLink || {}), enabled: !(s.familyLink && s.familyLink.enabled !== false) }; });
          renderAll();
        };
        document.getElementById('in-fl-limit').oninput = (e) => {
          const v = Number(e.target.value);
          AndroidOS.updateState(s => { s.familyLink = { ...(s.familyLink || {}), dailyLimitMinutes: v }; });
          renderAll();
        };
        document.getElementById('act-fl-bed').onclick = () => {
          AndroidOS.updateState(s => { s.familyLink = { ...(s.familyLink || {}), bedtimeEnabled: !(s.familyLink && s.familyLink.bedtimeEnabled) }; });
          renderAll();
        };
        return;
      }

      if (activeCategory === 'system') {
        const curLayout = AndroidOS.getOskLayout(st);
        panel.innerHTML = `
          <h2 style="font-size:18px;font-weight:700;margin-bottom:12px;">${AndroidOS.t('systemTitle', st)}</h2>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
            <div>
              <label style="font-size:11px;font-weight:700;display:block;margin-bottom:4px;">SPRACHE</label>
              <select id="in-lang" class="m3-input">
                <option value="de" ${st.language === 'de' ? 'selected' : ''}>Deutsch</option>
                <option value="en" ${st.language === 'en' ? 'selected' : ''}>English</option>
                <option value="fr" ${st.language === 'fr' ? 'selected' : ''}>Français</option>
                <option value="es" ${st.language === 'es' ? 'selected' : ''}>Español</option>
                <option value="ja" ${st.language === 'ja' ? 'selected' : ''}>日本語</option>
              </select>
            </div>
            <div>
              <label style="font-size:11px;font-weight:700;display:block;margin-bottom:4px;">REGION</label>
              <select id="in-region" class="m3-input">
                <option value="DE" ${st.region === 'DE' ? 'selected' : ''}>Deutschland (DE)</option>
                <option value="AT" ${st.region === 'AT' ? 'selected' : ''}>Österreich (AT)</option>
                <option value="CH" ${st.region === 'CH' ? 'selected' : ''}>Schweiz (CH)</option>
                <option value="LU" ${st.region === 'LU' ? 'selected' : ''}>Lukoland (LU)</option>
                <option value="US" ${st.region === 'US' ? 'selected' : ''}>United States (US)</option>
                <option value="GB" ${st.region === 'GB' ? 'selected' : ''}>United Kingdom (GB)</option>
                <option value="FR" ${st.region === 'FR' ? 'selected' : ''}>France (FR)</option>
                <option value="ES" ${st.region === 'ES' ? 'selected' : ''}>España (ES)</option>
                <option value="JP" ${st.region === 'JP' ? 'selected' : ''}>日本 (JP)</option>
              </select>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
            <div>
              <label style="font-size:11px;font-weight:700;display:block;margin-bottom:4px;">BENUTZERNAME</label>
              <input type="text" id="in-user" class="m3-input" value="${st.userName || 'Guest'}">
            </div>
            <div>
              <label style="font-size:11px;font-weight:700;display:block;margin-bottom:4px;">GERÄTENAME</label>
              <input type="text" id="in-device" class="m3-input" value="${st.deviceName || 'Pixel 10'}">
            </div>
          </div>

          <div style="margin-bottom:12px;">
            <label style="font-size:11px;font-weight:700;display:block;margin-bottom:4px;">SPERR-PIN (4–8 ZIFFERN, LEER = OHNE PIN)</label>
            <input type="password" id="in-pin" class="m3-input" inputmode="numeric" maxlength="8" value="${st.lockPin || ''}" placeholder="••••">
          </div>

          <button type="button" class="m3-btn" id="save-sys-profile" style="margin-bottom:14px;">Systemdaten speichern</button>

          <div class="inline-switch-row">
            <div>
              <div style="font-weight:700;">${AndroidOS.t('oskTitle', st)}</div>
              <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">${AndroidOS.t('oskSub', st)}</div>
            </div>
            <button type="button" class="m3-chip ${st.oskEnabled ? 'active' : ''}" id="act-osk">${st.oskEnabled ? 'An' : 'Aus'}</button>
          </div>

          <div style="margin-bottom:14px;">
            <label style="font-size:11px;font-weight:700;display:block;margin-bottom:6px;">GBOARD-LAYOUT</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              ${['qwertz', 'qwerty', 'azerty'].map(lay => `
                <button type="button" class="m3-chip ${curLayout === lay ? 'active' : ''}" data-osk-lay="${lay}">${lay.toUpperCase()}</button>
              `).join('')}
            </div>
          </div>

          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
            <button type="button" class="m3-btn m3-btn-tonal" id="btn-export-json">
              <span class="material-symbols-rounded" style="font-size:18px;">download</span>
              <span>JSON exportieren</span>
            </button>
            <label class="m3-btn m3-btn-tonal" style="cursor:pointer;">
              <span class="material-symbols-rounded" style="font-size:18px;">upload_file</span>
              <span>JSON importieren</span>
              <input type="file" id="in-import-json" accept=".json,application/json" style="display:none;">
            </label>
          </div>

          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" class="m3-btn m3-btn-outlined" id="btn-reboot">Neu starten</button>
            <button type="button" class="m3-btn m3-btn-outlined" id="btn-poweroff">Ausschalten</button>
            <button type="button" class="m3-btn danger-btn" id="btn-factory-reset">Auf Werkszustand zurücksetzen</button>
          </div>
        `;

        document.getElementById('save-sys-profile').onclick = () => {
          const lang = AndroidOS.normalizeLang(document.getElementById('in-lang').value);
          const reg = document.getElementById('in-region').value || 'DE';
          const usr = document.getElementById('in-user').value.trim() || 'Guest';
          const dev = document.getElementById('in-device').value.trim() || 'Pixel 10';
          const pin = document.getElementById('in-pin').value.replace(/\D/g, '').slice(0, 8);
          AndroidOS.updateState(s => {
            s.language = lang;
            s.region = reg;
            s.userName = usr;
            s.deviceName = dev;
            s.lockPin = pin;
          });
          AndroidOS.showToast(AndroidOS.t('saved'));
          renderAll();
        };

        document.getElementById('act-osk').onclick = () => {
          AndroidOS.setOskEnabled(!AndroidOS.isOskEnabled());
          renderAll();
        };

        panel.querySelectorAll('[data-osk-lay]').forEach(btn => {
          btn.onclick = () => {
            AndroidOS.setOskLayout(btn.dataset.oskLay);
            renderAll();
          };
        });

        document.getElementById('btn-export-json').onclick = () => {
          const jsonStr = AndroidOS.exportStateJson();
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `android-os-backup-${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
          AndroidOS.showToast('JSON-Backup exportiert.');
        };

        document.getElementById('in-import-json').onchange = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              AndroidOS.importStateJson(reader.result);
              AndroidOS.showToast('Backup importiert. Sperrbildschirm wird geöffnet…');
              setTimeout(() => { window.location.replace('lockscreen.html'); }, 450);
            } catch (_) {
              AndroidOS.showToast('Ungültige JSON-Datei.');
            }
          };
          reader.readAsText(file);
        };

        document.getElementById('btn-reboot').onclick = () => AndroidOS.rebootDevice(true);
        document.getElementById('btn-poweroff').onclick = () => AndroidOS.powerOffDevice(true);
        document.getElementById('btn-factory-reset').onclick = () => {
          if (confirm('Alle Einstellungen, Notizen, Aufgaben und Konten löschen und OOBE starten?')) {
            AndroidOS.factoryReset(true);
          }
        };
      }
    }

    function renderAll() {
      renderList();
      renderDetailPanel();
    }

    document.getElementById('settings-search').addEventListener('input', (e) => {
      searchQuery = e.target.value || '';
      renderList();
    });

    renderAll();
  </script>
</body>
</html>
