<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hilfe – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .help-wrap {
      flex: 1;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 18px 96px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .faq-item {
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 16px;
      padding: 12px 14px;
      background: var(--md-sys-color-surface-container-low);
    }
    .faq-q {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .faq-a {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <header class="app-topbar">
      <div class="app-title-group">
        <a href="start.html" class="icon-btn" title="Start">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <h1 style="font-size:21px;font-weight:600;">Hilfe</h1>
        </div>
      </div>
    </header>

    <main class="help-wrap">
      <div class="m3-card">
        <div style="font-weight:700;font-size:15px;margin-bottom:8px;">Hilfe durchsuchen</div>
        <div class="settings-search-pill" style="margin:0;">
          <span class="material-symbols-rounded" style="color:var(--md-sys-color-on-surface-variant);">search</span>
          <input type="search" id="help-search" oninput="renderHelp()" placeholder="z. B. WLAN, OOBE, PIN, Docs, Gladbach…">
        </div>
      </div>

      <div class="m3-card">
        <div style="font-weight:700;font-size:15px;margin-bottom:10px;">Schnellzugriffe</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <a href="oobe.html" class="m3-btn m3-btn-tonal">OOBE (10 Schritte)</a>
          <a href="einstellungen.html" class="m3-btn m3-btn-tonal">Einstellungen & Fake WLAN</a>
          <a href="docs.html" class="m3-btn m3-btn-tonal">Docs</a>
          <a href="files.html" class="m3-btn m3-btn-tonal">Files</a>
        </div>
      </div>

      <div class="m3-card">
        <div style="font-weight:700;font-size:15px;margin-bottom:10px;">Häufige Fragen & Guides</div>
        <div id="help-faq-list" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>
    </main>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();

    const HELP_ENTRIES = [
      {
        q: 'Wie funktioniert das Fake WLAN Setup?',
        a: 'In den Einstellungen unter „Netzwerk und Internet“ sowie in Schritt 3 der OOBE kannst du simulierte WLAN-Netze auswählen, scannen oder eigene SSIDs inklusive Passwort und Sicherheitsstandard anlegen.'
      },
      {
        q: 'Was umfasst die 10-Schritte-OOBE und die Nutzungsbedingungen?',
        a: 'Die OOBE führt in 10 Schritten durch Sprache, Nutzungsbedingungen (inkl. Fohlen-/Gladbach-Klausel), Fake WLAN Setup, Gerät/Profil, Konto & Sync, Farbschema/Modus, PIN, Bedienungshilfen, Workspace und Abschluss.'
      },
      {
        q: 'Wie setze ich den Lockscreen oder die PIN zurück?',
        a: 'In den Einstellungen unter „System & Backup“ kannst du die Sperr-PIN ändern oder über „Zurücksetzen“ den lokalen Speicher neu initialisieren.'
      },
      {
        q: 'Wo werden Dokumente und Dateien gespeichert?',
        a: 'Docs und Files teilen sich den lokalen Browser-Speicher (localStorage) und lassen sich über die Backup-Funktion in den Einstellungen als JSON exportieren und importieren.'
      }
    ];

    function renderHelp() {
      const q = (document.getElementById('help-search').value || '').trim().toLowerCase();
      const filtered = HELP_ENTRIES.filter(item => !q || (item.q + ' ' + item.a).toLowerCase().includes(q));
      const wrap = document.getElementById('help-faq-list');
      if (!filtered.length) {
        wrap.innerHTML = '<div class="settings-item-sub">Keine passenden Hilfethemen gefunden.</div>';
        return;
      }
      wrap.innerHTML = filtered.map(item => `
        <div class="faq-item">
          <div class="faq-q">${item.q}</div>
          <div class="faq-a">${item.a}</div>
        </div>
      `).join('');
    }

    renderHelp();
  </script>
</body>
</html>
