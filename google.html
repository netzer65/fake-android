<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .g-search-bar {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 999px;
      background: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      margin-bottom: 16px;
    }
    .g-search-bar input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--md-sys-color-on-surface);
      font-size: 15px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <header class="app-topbar">
      <div class="app-title-group">
        <a href="start.html" class="icon-btn" title="Start">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <h1 style="font-size:21px;font-weight:700;">Google</h1>
          <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">Suche & Discover-Feed</div>
        </div>
      </div>
      <a href="gemini.html" class="m3-btn m3-btn-tonal">Gemini</a>
    </header>

    <main class="app-main" style="max-width:720px;">
      <div class="g-search-bar">
        <span class="material-symbols-rounded" style="color:var(--md-sys-color-primary);">search</span>
        <input type="search" id="g-query" placeholder="Google durchsuchen oder App-Befehl eingeben…" onkeydown="if(event.key==='Enter') runSearch()">
        <button class="m3-btn" style="padding:8px 16px;" onclick="runSearch()">Suchen</button>
      </div>

      <div id="g-results"></div>
    </main>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();
    const FEED = [
      { title: 'Material 3 Expressive & Web-OS', tag: 'System', text: 'Alle System-Apps teilen Theme, Sprache, Akku-Status und Zustand über localStorage.', href: 'einstellungen.html' },
      { title: 'Erdbebenwarnung Demo testen', tag: 'Sicherheit', text: 'Simuliere Erschütterungs-Warnungen und Schutzhinweise in der Erdbeben-App.', href: 'erdbeben.html' },
      { title: '2048 & Sudoku im Google Play Store', tag: 'Spiele', text: 'Neue Spiele im Store installieren und direkt im Browser spielen.', href: 'play.html' }
    ];

    function runSearch() {
      const q = (document.getElementById('g-query').value || '').trim().toLowerCase();
      const el = document.getElementById('g-results');
      if (!q) {
        renderFeed(FEED);
        return;
      }
      const hits = FEED.filter(x => (x.title + ' ' + x.text + ' ' + x.tag).toLowerCase().includes(q));
      if (!hits.length) {
        el.innerHTML = `<div class="m3-card">Keine lokalen Treffer für „${q}“. <a href="gemini.html" style="color:var(--md-sys-color-primary);font-weight:700;">Gemini fragen →</a></div>`;
        return;
      }
      renderFeed(hits);
    }

    function renderFeed(list) {
      document.getElementById('g-results').innerHTML = list.map(item => `
        <div class="m3-card" style="margin-bottom:12px;">
          <div style="font-size:11px;font-weight:700;color:var(--md-sys-color-primary);margin-bottom:4px;">${item.tag}</div>
          <h3 style="font-size:17px;margin-bottom:6px;">${item.title}</h3>
          <p style="font-size:14px;color:var(--md-sys-color-on-surface-variant);margin-bottom:10px;">${item.text}</p>
          <a href="${item.href}" class="m3-btn m3-btn-tonal" style="padding:8px 14px;">Öffnen</a>
        </div>
      `).join('');
    }

    renderFeed(FEED);
  </script>
</body>
</html>
