<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Systemfehler – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .err-card {
      max-width: 560px;
      margin: 24px auto;
      text-align: center;
      padding: 28px 22px;
      border-radius: 28px;
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .err-code {
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.08);
      display: inline-block;
      margin: 10px 0 14px;
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <main class="app-main">
      <div class="err-card">
        <span class="material-symbols-rounded filled" style="font-size:56px;">error</span>
        <h1 style="font-size:24px;font-weight:700;margin-top:8px;">Systemprozess angehalten</h1>
        <div class="err-code" id="err-code-badge">ERR_SYSTEMUI_WATCHDOG · 0x80070057</div>
        <p id="err-msg" style="font-size:14px;line-height:1.5;margin-bottom:20px;">
          Ein simulierter Systemfehler wurde ausgelöst. Deine gespeicherten Daten bleiben erhalten.
        </p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
          <a href="start.html" class="m3-btn">App neu starten</a>
          <button class="m3-btn m3-btn-tonal" onclick="AndroidOS.rebootDevice(true)">System neu starten</button>
          <button class="m3-btn m3-btn-outlined" onclick="triggerSampleError()">Anderen Fehler testen</button>
        </div>
      </div>
    </main>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();
    const ERRORS = [
      { code: 'ERR_SYSTEMUI_WATCHDOG · 0x80070057', msg: 'SystemUI hat auf eine Render-Anfrage nicht rechtzeitig geantwortet.' },
      { code: 'ERR_VFS_LOCALSTORAGE · QUOTA_EXCEEDED', msg: 'Speicher-Simulationsfehler beim Schreiben von Zustandsdaten.' },
      { code: 'ERR_CAMERA_PIPELINE · HAL_TIMEOUT', msg: 'Kamerapipeline wurde unerwartet zurückgesetzt.' }
    ];
    let eIdx = 0;
    function triggerSampleError() {
      eIdx = (eIdx + 1) % ERRORS.length;
      document.getElementById('err-code-badge').textContent = ERRORS[eIdx].code;
      document.getElementById('err-msg').textContent = ERRORS[eIdx].msg;
    }
  </script>
</body>
</html>
