<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .board-2048 {
      max-width: 380px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 12px;
      border-radius: 24px;
      background: var(--md-sys-color-surface-container-highest);
    }
    .tile-2048 {
      aspect-ratio: 1;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      background: var(--md-sys-color-surface-container);
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <header class="app-topbar">
      <div class="app-title-group">
        <a href="play.html" class="icon-btn" title="Google Play">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <h1 style="font-size:21px;font-weight:700;">2048</h1>
          <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);" id="score-2048">Punkte: 0</div>
        </div>
      </div>
      <button class="m3-btn m3-btn-tonal" onclick="init2048()">Neu</button>
    </header>

    <main class="app-main">
      <div class="board-2048" id="grid-2048"></div>
      <div style="display:flex;justify-content:center;gap:8px;margin-top:16px;">
        <button class="m3-chip" onclick="move('left')">←</button>
        <button class="m3-chip" onclick="move('up')">↑</button>
        <button class="m3-chip" onclick="move('down')">↓</button>
        <button class="m3-chip" onclick="move('right')">→</button>
      </div>
    </main>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();
    let grid = [];
    let score = 0;

    function addRandom() {
      const empty = [];
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!grid[r][c]) empty.push([r, c]);
      if (!empty.length) return;
      const [r, c] = empty[Math.floor(Math.random() * empty.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function init2048() {
      grid = Array.from({ length: 4 }, () => [0, 0, 0, 0]);
      score = 0;
      addRandom();
      addRandom();
      render2048();
    }

    function slideRow(row) {
      const arr = row.filter(v => v !== 0);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          score += arr[i];
          arr[i + 1] = 0;
        }
      }
      const clean = arr.filter(v => v !== 0);
      while (clean.length < 4) clean.push(0);
      return clean;
    }

    function rotateGrid(mat) {
      return mat[0].map((_, c) => mat.map(r => r[c]).reverse());
    }

    function move(dir) {
      const before = JSON.stringify(grid);
      let turns = 0;
      if (dir === 'up') turns = 3;
      if (dir === 'right') turns = 2;
      if (dir === 'down') turns = 1;
      for (let i = 0; i < turns; i++) grid = rotateGrid(grid);
      grid = grid.map(slideRow);
      for (let i = 0; i < (4 - turns) % 4; i++) grid = rotateGrid(grid);
      if (JSON.stringify(grid) !== before) {
        addRandom();
        render2048();
      }
    }

    function render2048() {
      document.getElementById('score-2048').textContent = `Punkte: ${score}`;
      const el = document.getElementById('grid-2048');
      el.innerHTML = grid.flat().map(v => {
        const bg = v ? `hsl(${Math.min(220, 205 + Math.log2(v) * 14)}, 75%, ${v >= 64 ? '45%' : '82%'})` : '';
        const fg = v >= 64 ? '#fff' : '#0f172a';
        return `<div class="tile-2048" style="${v ? `background:${bg};color:${fg};` : ''}">${v || ''}</div>`;
      }).join('');
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') move('left');
      if (e.key === 'ArrowRight') move('right');
      if (e.key === 'ArrowUp') move('up');
      if (e.key === 'ArrowDown') move('down');
    });

    init2048();
  </script>
</body>
</html>
