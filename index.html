<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Android</title>
  <link rel="stylesheet" href="system.css">
</head>
<body>
  <script src="system.js"></script>
  <script>
    (function routeSystem() {
      const hasRaw = AndroidOS.hasRawStorage();
      const st = AndroidOS.getState();
      AndroidOS.applyAppearance(st);

      // First start (no stored state yet) or powered off -> bootscreen.html
      if (!hasRaw || st.poweredOff || (!st.hasData && !st.oobeCompleted)) {
        window.location.replace('bootscreen.html');
        return;
      }

      // Data present: unlocked in the last 5 minutes and not actively locked -> start.html
      if (!st.locked && AndroidOS.isUnlockedRecently(st)) {
        window.location.replace('start.html');
      } else {
        window.location.replace('lockscreen.html');
      }
    })();
  </script>
</body>
</html>
