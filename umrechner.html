<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umrechner – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .cat-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .cat-bar::-webkit-scrollbar {
      display: none;
    }
    .conv-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .conv-row {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 10px;
      align-items: center;
    }
    .conv-select {
      width: 100%;
      padding: 14px 14px;
      border-radius: 16px;
      border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
    .conv-select:focus {
      border-color: var(--md-sys-color-primary);
    }
    .conv-number {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
    }
    .swap-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .formula-pill {
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 12px;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
      flex: 1;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }
    .quick-tile {
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--md-sys-color-surface-container);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    @media (max-width: 520px) {
      .conv-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <header class="app-topbar">
      <div class="app-title-group">
        <a href="start.html" class="icon-btn" title="Startbildschirm">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <h1 style="font-size:22px;font-weight:700;">Umrechner</h1>
          <div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);">8 Kategorien · Echtzeit-Berechnung</div>
        </div>
      </div>
      <button class="icon-btn" onclick="copyResult()" title="Ergebnis kopieren">
        <span class="material-symbols-rounded" id="copy-icon">content_copy</span>
      </button>
    </header>

    <main class="app-main" style="max-width:760px;">
      <div class="cat-bar" id="cat-bar"></div>

      <div class="m3-card conv-panel">
        <div>
          <label style="font-size:12px;font-weight:700;color:var(--md-sys-color-primary);display:block;margin-bottom:6px;">AUSGANGSWERT</label>
          <div class="conv-row">
            <input type="number" id="val-a" class="m3-input conv-number" value="1" step="any" oninput="convert('a')">
            <select id="unit-a" class="conv-select" onchange="convert('a')"></select>
          </div>
        </div>

        <div class="swap-row">
          <div class="formula-pill" id="rate-info">1 = 1</div>
          <button class="m3-btn m3-btn-tonal" style="padding:10px 16px;" onclick="swapUnits()" title="Einheiten tauschen">
            <span class="material-symbols-rounded" style="font-size:20px;">swap_vert</span>
            <span>Tauschen</span>
          </button>
        </div>

        <div>
          <label style="font-size:12px;font-weight:700;color:var(--md-sys-color-primary);display:block;margin-bottom:6px;">ZIELWERT</label>
          <div class="conv-row">
            <input type="number" id="val-b" class="m3-input conv-number" value="1" step="any" oninput="convert('b')">
            <select id="unit-b" class="conv-select" onchange="convert('a')"></select>
          </div>
        </div>
      </div>

      <div class="m3-card-filled" style="margin-top:16px;">
        <div style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--md-sys-color-on-surface-variant);">
          Alle Einheiten in dieser Kategorie im Überblick
        </div>
        <div class="quick-grid" id="all-units-grid"></div>
      </div>
    </main>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();

    const CATEGORIES = {
      length: {
        label: 'Länge',
        icon: 'straighten',
        defaultA: 'km',
        defaultB: 'mi',
        defaultVal: 10,
        units: {
          mm: { name: 'Millimeter (mm)', factor: 0.001 },
          cm: { name: 'Zentimeter (cm)', factor: 0.01 },
          m:  { name: 'Meter (m)', factor: 1 },
          km: { name: 'Kilometer (km)', factor: 1000 },
          in: { name: 'Zoll / Inch (in)', factor: 0.0254 },
          ft: { name: 'Fuß (ft)', factor: 0.3048 },
          yd: { name: 'Yard (yd)', factor: 0.9144 },
          mi: { name: 'Meilen (mi)', factor: 1609.344 },
          nmi:{ name: 'Seemeilen (sm)', factor: 1852 }
        }
      },
      mass: {
        label: 'Gewicht',
        icon: 'scale',
        defaultA: 'kg',
        defaultB: 'lb',
        defaultVal: 5,
        units: {
          mg: { name: 'Milligramm (mg)', factor: 0.000001 },
          g:  { name: 'Gramm (g)', factor: 0.001 },
          kg: { name: 'Kilogramm (kg)', factor: 1 },
          t:  { name: 'Tonne (t)', factor: 1000 },
          oz: { name: 'Unze (oz)', factor: 0.0283495231 },
          lb: { name: 'Pfund (lb)', factor: 0.45359237 }
        }
      },
      temp: {
        label: 'Temperatur',
        icon: 'thermostat',
        defaultA: 'c',
        defaultB: 'f',
        defaultVal: 20,
        isTemp: true,
        units: {
          c: { name: 'Celsius (°C)' },
          f: { name: 'Fahrenheit (°F)' },
          k: { name: 'Kelvin (K)' }
        }
      },
      speed: {
        label: 'Tempo',
        icon: 'speed',
        defaultA: 'kmh',
        defaultB: 'mph',
        defaultVal: 100,
        units: {
          ms:  { name: 'Meter/Sekunde (m/s)', factor: 1 },
          kmh: { name: 'Kilometer/Stunde (km/h)', factor: 1 / 3.6 },
          mph: { name: 'Meilen/Stunde (mph)', factor: 0.44704 },
          kn:  { name: 'Knoten (kn)', factor: 0.514444 }
        }
      },
      area: {
        label: 'Fläche',
        icon: 'square_foot',
        defaultA: 'sqm',
        defaultB: 'ha',
        defaultVal: 2500,
        units: {
          sqcm: { name: 'Quadratzentimeter (cm²)', factor: 0.0001 },
          sqm:  { name: 'Quadratmeter (m²)', factor: 1 },
          a:    { name: 'Ar (a)', factor: 100 },
          ha:   { name: 'Hektar (ha)', factor: 10000 },
          sqkm: { name: 'Quadratkilometer (km²)', factor: 1000000 },
          sqft: { name: 'Quadratfuß (ft²)', factor: 0.09290304 },
          ac:   { name: 'Acre (ac)', factor: 4046.85642 }
        }
      },
      volume: {
        label: 'Volumen',
        icon: 'water_drop',
        defaultA: 'l',
        defaultB: 'gal',
        defaultVal: 10,
        units: {
          ml:  { name: 'Milliliter (ml)', factor: 0.001 },
          cl:  { name: 'Zentiliter (cl)', factor: 0.01 },
          l:   { name: 'Liter (l)', factor: 1 },
          cbm: { name: 'Kubikmeter (m³)', factor: 1000 },
          floz:{ name: 'Fluid Ounce US (fl oz)', factor: 0.0295735 },
          gal: { name: 'Gallone US (gal)', factor: 3.78541178 }
        }
      },
      data: {
        label: 'Daten',
        icon: 'storage',
        defaultA: 'gb',
        defaultB: 'mb',
        defaultVal: 4,
        units: {
          b:  { name: 'Byte (B)', factor: 1 },
          kb: { name: 'Kilobyte (KB)', factor: 1024 },
          mb: { name: 'Megabyte (MB)', factor: 1024 ** 2 },
          gb: { name: 'Gigabyte (GB)', factor: 1024 ** 3 },
          tb: { name: 'Terabyte (TB)', factor: 1024 ** 4 }
        }
      },
      time: {
        label: 'Zeit',
        icon: 'schedule',
        defaultA: 'h',
        defaultB: 'min',
        defaultVal: 2.5,
        units: {
          ms:  { name: 'Millisekunden (ms)', factor: 0.001 },
          s:   { name: 'Sekunden (s)', factor: 1 },
          min: { name: 'Minuten (min)', factor: 60 },
          h:   { name: 'Stunden (h)', factor: 3600 },
          d:   { name: 'Tage (d)', factor: 86400 },
          w:   { name: 'Wochen (Wo.)', factor: 604800 }
        }
      }
    };

    let activeCat = 'length';

    function formatNum(num) {
      if (!Number.isFinite(num)) return '';
      if (Math.abs(num) >= 1e9 || (Math.abs(num) > 0 && Math.abs(num) < 1e-5)) {
        return Number(num.toPrecision(6)).toString();
      }
      return (Math.round(num * 1e6) / 1e6).toString();
    }

    function convertTemp(val, from, to) {
      if (from === to) return val;
      let celsius = val;
      if (from === 'f') celsius = (val - 32) * 5 / 9;
      if (from === 'k') celsius = val - 273.15;

      if (to === 'c') return celsius;
      if (to === 'f') return (celsius * 9 / 5) + 32;
      if (to === 'k') return celsius + 273.15;
      return val;
    }

    function computeValue(val, fromKey, toKey, catObj) {
      if (catObj.isTemp) {
        return convertTemp(val, fromKey, toKey);
      }
      const base = val * catObj.units[fromKey].factor;
      return base / catObj.units[toKey].factor;
    }

    function renderCategories() {
      const bar = document.getElementById('cat-bar');
      bar.innerHTML = Object.entries(CATEGORIES).map(([key, cat]) => `
        <button class="m3-chip ${key === activeCat ? 'active' : ''}" onclick="selectCategory('${key}')">
          <span class="material-symbols-rounded" style="font-size:18px;">${cat.icon}</span>
          <span>${cat.label}</span>
        </button>
      `).join('');
    }

    function selectCategory(catKey) {
      activeCat = catKey;
      renderCategories();
      const cat = CATEGORIES[catKey];
      const selA = document.getElementById('unit-a');
      const selB = document.getElementById('unit-b');

      const opts = Object.entries(cat.units).map(([uKey, uObj]) =>
        `<option value="${uKey}">${uObj.name}</option>`
      ).join('');

      selA.innerHTML = opts;
      selB.innerHTML = opts;
      selA.value = cat.defaultA;
      selB.value = cat.defaultB;
      document.getElementById('val-a').value = cat.defaultVal;
      convert('a');
    }

    function convert(source) {
      const cat = CATEGORIES[activeCat];
      const inpA = document.getElementById('val-a');
      const inpB = document.getElementById('val-b');
      const uA = document.getElementById('unit-a').value;
      const uB = document.getElementById('unit-b').value;

      if (source === 'a') {
        const raw = inpA.value;
        if (raw === '') { inpB.value = ''; renderOverview(0, uA); return; }
        const res = computeValue(Number(raw), uA, uB, cat);
        inpB.value = formatNum(res);
        renderOverview(Number(raw), uA);
      } else {
        const raw = inpB.value;
        if (raw === '') { inpA.value = ''; renderOverview(0, uA); return; }
        const res = computeValue(Number(raw), uB, uA, cat);
        inpA.value = formatNum(res);
        renderOverview(res, uA);
      }

      const unitRate = computeValue(1, uA, uB, cat);
      document.getElementById('rate-info').textContent = `1 ${uA.toUpperCase()} = ${formatNum(unitRate)} ${uB.toUpperCase()}`;
    }

    function renderOverview(baseVal, fromKey) {
      const cat = CATEGORIES[activeCat];
      const grid = document.getElementById('all-units-grid');
      grid.innerHTML = Object.entries(cat.units).map(([uKey, uObj]) => {
        const converted = computeValue(baseVal, fromKey, uKey, cat);
        return `
          <div class="quick-tile">
            <span style="font-size:11px;font-weight:700;color:var(--md-sys-color-primary);">${uObj.name}</span>
            <span style="font-family:var(--font-mono);font-size:15px;font-weight:700;">${formatNum(converted)}</span>
          </div>
        `;
      }).join('');
    }

    function swapUnits() {
      const selA = document.getElementById('unit-a');
      const selB = document.getElementById('unit-b');
      const tmp = selA.value;
      selA.value = selB.value;
      selB.value = tmp;
      convert('a');
    }

    function copyResult() {
      const valB = document.getElementById('val-b').value;
      const unitB = document.getElementById('unit-b').selectedOptions[0]?.textContent || '';
      if (!valB) return;
      navigator.clipboard?.writeText(`${valB} ${unitB}`);
      const icon = document.getElementById('copy-icon');
      icon.textContent = 'check';
      setTimeout(() => { icon.textContent = 'content_copy'; }, 1400);
    }

    selectCategory('length');
  </script>
</body>
</html>
