<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docs – Android</title>
  <link rel="stylesheet" href="system.css">
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <header class="app-topbar">
      <div class="app-title-group">
        <a href="start.html" class="icon-btn" title="Start">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <h1 style="font-size:21px;font-weight:600;">Docs</h1>
          <div class="settings-item-sub" id="docs-sync-status">Synchronisiert mit Files</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;">
        <button type="button" class="icon-btn" onclick="toggleDocList()" title="Dokumentliste">
          <span class="material-symbols-rounded">folder_open</span>
        </button>
        <a href="files.html" class="icon-btn" title="In Files öffnen">
          <span class="material-symbols-rounded">folder</span>
        </a>
        <button type="button" class="m3-btn" style="padding:8px 14px;font-size:13px;" onclick="createDoc()">
          <span class="material-symbols-rounded" style="font-size:18px;">add</span>
          <span>Neu</span>
        </button>
      </div>
    </header>

    <main class="app-main">
      <div class="docs-layout">
        <aside class="m3-card docs-sidebar-card" id="docs-sidebar">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong style="font-size:14px;">Dateien in Docs</strong>
            <a href="files.html" style="font-size:12px;color:var(--md-sys-color-primary);text-decoration:none;font-weight:700;">Files</a>
          </div>
          <input type="search" id="doc-filter" class="m3-input" style="padding:8px 12px;font-size:13px;" oninput="renderDocList()" placeholder="Dokument filtern…">
          <div id="doc-list" style="display:flex;flex-direction:column;gap:6px;max-height:360px;overflow-y:auto;"></div>
        </aside>

        <section class="m3-card" id="doc-editor-card">
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
            <input type="text" id="doc-title-input" class="m3-input" style="flex:1;min-width:180px;font-weight:700;" oninput="saveCurrentDoc()" placeholder="Dokumenttitel…">
            <select id="doc-folder-select" class="m3-input" style="width:auto;min-width:130px;" onchange="saveCurrentDoc()">
              <option value="Dokumente">Dokumente</option>
              <option value="Arbeit">Arbeit</option>
              <option value="Reisen">Reisen</option>
              <option value="Entwürfe">Entwürfe</option>
            </select>
          </div>

          <div class="doc-toolbar">
            <button type="button" class="m3-chip" style="padding:5px 10px;font-size:12px;" onclick="insertSnippet('# ')">H1</button>
            <button type="button" class="m3-chip" style="padding:5px 10px;font-size:12px;" onclick="insertSnippet('- ')">Liste</button>
            <button type="button" class="m3-chip" style="padding:5px 10px;font-size:12px;" onclick="insertSnippet('[ ] ')">Aufgabe</button>
            <button type="button" class="m3-chip" style="padding:5px 10px;font-size:12px;" id="btn-mono-toggle" onclick="toggleMonoMode()">Mono</button>
            <button type="button" class="m3-chip" style="padding:5px 10px;font-size:12px;" onclick="speakCurrentDoc()">Vorlesen</button>
            <button type="button" class="m3-chip" style="padding:5px 10px;font-size:12px;" onclick="exportCurrentDoc()">Export</button>
          </div>

          <textarea id="doc-body-input" class="doc-editor-area" oninput="saveCurrentDoc()" placeholder="Hier schreiben… Änderungen werden automatisch in Files gespeichert."></textarea>

          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--md-sys-color-on-surface-variant);">
            <span id="doc-stats">0 Wörter · 0 Zeichen</span>
            <div style="display:flex;gap:8px;">
              <button type="button" class="m3-btn m3-btn-tonal" style="padding:7px 14px;font-size:12px;" onclick="deleteCurrentDoc()">Löschen</button>
              <button type="button" class="m3-btn" style="padding:7px 14px;font-size:12px;" onclick="saveCurrentDoc(true)">Speichern</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();

    let currentDocId = null;
    let monoActive = false;

    function getDocs() {
      const st = AndroidOS.getState();
      return Array.isArray(st.docs) ? st.docs : [];
    }

    function initDocSelection() {
      const params = new URLSearchParams(window.location.search);
      const qId = params.get('id');
      const docs = getDocs();
      if (qId && docs.some(d => d.id === qId)) {
        currentDocId = qId;
      } else if (docs.length > 0) {
        currentDocId = docs[0].id;
      } else {
        const created = createDoc(false);
        currentDocId = created.id;
      }
      renderDocList();
      loadCurrentDocIntoEditor();
    }

    function toggleDocList() {
      const sb = document.getElementById('docs-sidebar');
      if (!sb) return;
      if (window.innerWidth <= 680) {
        sb.style.display = sb.style.display === 'none' ? 'flex' : 'none';
      } else {
        sb.scrollIntoView({ behavior: 'smooth' });
      }
    }

    function createDoc(focusTitle = true) {
      const docs = getDocs();
      const newDoc = {
        id: 'doc_' + Date.now(),
        title: `Neues Dokument ${docs.length + 1}`,
        folder: 'Dokumente',
        content: '',
        updated: 'Gerade eben'
      };
      AndroidOS.updateState(s => {
        s.docs = [newDoc, ...(Array.isArray(s.docs) ? s.docs : [])];
      });
      currentDocId = newDoc.id;
      renderDocList();
      loadCurrentDocIntoEditor();
      if (focusTitle) {
        document.getElementById('doc-title-input').focus();
      }
      return newDoc;
    }

    function selectDoc(id) {
      currentDocId = id;
      renderDocList();
      loadCurrentDocIntoEditor();
      if (window.innerWidth <= 680) {
        const sb = document.getElementById('docs-sidebar');
        if (sb) sb.style.display = 'none';
      }
    }

    function loadCurrentDocIntoEditor() {
      const doc = getDocs().find(d => d.id === currentDocId) || getDocs()[0];
      if (!doc) return;
      currentDocId = doc.id;
      document.getElementById('doc-title-input').value = doc.title || '';
      document.getElementById('doc-folder-select').value = doc.folder || 'Dokumente';
      document.getElementById('doc-body-input').value = doc.content || '';
      updateStats(doc.content || '');
      document.getElementById('docs-sync-status').textContent = `Aktiv in Files · ${doc.updated || 'Heute'}`;
    }

    function saveCurrentDoc(showMsg = false) {
      if (!currentDocId) return;
      const title = document.getElementById('doc-title-input').value.trim() || 'Ohne Titel';
      const folder = document.getElementById('doc-folder-select').value || 'Dokumente';
      const content = document.getElementById('doc-body-input').value;
      updateStats(content);

      AndroidOS.updateState(s => {
        const list = Array.isArray(s.docs) ? [...s.docs] : [];
        const idx = list.findIndex(d => d.id === currentDocId);
        if (idx >= 0) {
          list[idx] = { ...list[idx], title, folder, content, updated: 'Gerade eben' };
        }
        s.docs = list;
      });
      renderDocList();
      document.getElementById('docs-sync-status').textContent = 'Mit Files synchronisiert · Gerade eben';
      if (showMsg) AndroidOS.showToast('Dokument gespeichert & mit Files abgeglichen.');
    }

    function deleteCurrentDoc() {
      if (!currentDocId) return;
      AndroidOS.updateState(s => {
        s.docs = (Array.isArray(s.docs) ? s.docs : []).filter(d => d.id !== currentDocId);
      });
      const remaining = getDocs();
      currentDocId = remaining.length > 0 ? remaining[0].id : null;
      if (!currentDocId) {
        createDoc(false);
      } else {
        renderDocList();
        loadCurrentDocIntoEditor();
      }
      AndroidOS.showToast('Dokument entfernt.');
    }

    function insertSnippet(prefix) {
      const ta = document.getElementById('doc-body-input');
      const start = ta.selectionStart || 0;
      const end = ta.selectionEnd || 0;
      const cur = ta.value || '';
      const next = cur.slice(0, start) + prefix + cur.slice(end);
      ta.value = next;
      ta.focus();
      const pos = start + prefix.length;
      try { ta.setSelectionRange(pos, pos); } catch (e) {}
      saveCurrentDoc();
    }

    function toggleMonoMode() {
      monoActive = !monoActive;
      document.getElementById('doc-body-input').classList.toggle('mono-mode', monoActive);
      document.getElementById('btn-mono-toggle').classList.toggle('active', monoActive);
    }

    function speakCurrentDoc() {
      const title = document.getElementById('doc-title-input').value || '';
      const body = document.getElementById('doc-body-input').value || '';
      if (typeof AndroidOS.speakText === 'function') {
        AndroidOS.speakText(`${title}. ${body}`);
      } else {
        AndroidOS.showToast('Vorlesefunktion nicht verfügbar.');
      }
    }

    function exportCurrentDoc() {
      const title = (document.getElementById('doc-title-input').value || 'dokument').trim().replace(/[^a-zA-Z0-9_-]+/g, '_');
      const body = document.getElementById('doc-body-input').value || '';
      const blob = new Blob([body], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${title || 'dokument'}.txt`;
      a.click();
      URL.revokeObjectURL(url);
      AndroidOS.showToast('Dokument als .txt exportiert.');
    }

    function updateStats(text) {
      const clean = String(text || '').trim();
      const words = clean ? clean.split(/\s+/).length : 0;
      const chars = String(text || '').length;
      document.getElementById('doc-stats').textContent = `${words} Wörter · ${chars} Zeichen`;
    }

    function renderDocList() {
      const q = (document.getElementById('doc-filter').value || '').trim().toLowerCase();
      const docs = getDocs().filter(d => !q || ((d.title || '') + ' ' + (d.folder || '') + ' ' + (d.content || '')).toLowerCase().includes(q));
      const wrap = document.getElementById('doc-list');
      if (!docs.length) {
        wrap.innerHTML = `<div class="settings-item-sub">Keine Dokumente.</div>`;
        return;
      }
      wrap.innerHTML = docs.map(d => `
        <button type="button" class="doc-list-item${d.id === currentDocId ? ' active' : ''}" onclick="selectDoc('${d.id}')">
          <span style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${d.title || 'Ohne Titel'}</span>
          <span style="font-size:11px;opacity:0.78;">${d.folder || 'Dokumente'} · ${d.updated || 'Heute'}</span>
        </button>
      `).join('');
    }

    initDocSelection();
  </script>
</body>
</html>
