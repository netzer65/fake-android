<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maps – Android</title>
  <link rel="stylesheet" href="system.css">
  <style>
    .map-canvas {
      position: relative;
      height: 320px;
      border-radius: 24px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.22) 1px, transparent 1px) 0 0 / 48px 48px,
        linear-gradient(rgba(255,255,255,0.22) 1px, transparent 1px) 0 0 / 48px 48px,
        linear-gradient(135deg, #CBE7D6 0%, #D9ECFA 55%, #E7E3D5 100%);
      border: 1px solid var(--md-sys-color-outline-variant);
      margin-bottom: 14px;
    }
    :root[data-mode="dark"] .map-canvas {
      background:
        linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px) 0 0 / 48px 48px,
        linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px) 0 0 / 48px 48px,
        linear-gradient(135deg, #172A24 0%, #162638 55%, #23211C 100%);
    }
    .map-road-h {
      position: absolute;
      left: 0;
      right: 0;
      top: 52%;
      height: 12px;
      background: rgba(255, 255, 255, 0.85);
      transform: rotate(-3deg);
    }
    .map-road-v {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 46%;
      width: 12px;
      background: rgba(255, 255, 255, 0.85);
      transform: rotate(4deg);
    }
    :root[data-mode="dark"] .map-road-h,
    :root[data-mode="dark"] .map-road-v {
      background: rgba(148, 163, 184, 0.35);
    }
    .map-pin {
      position: absolute;
      transform: translate(-50%, -100%);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--md-sys-color-primary);
    }
    .map-pin-label {
      margin-top: 2px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: var(--md-sys-color-surface-container-lowest);
      color: var(--md-sys-color-on-surface);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="android-shell">
    <div id="sys-status-bar" class="status-bar"></div>
    <div id="sys-qs-root"></div>

    <header class="app-topbar">
      <div class="app-title-group">
        <a href="start.html" class="icon-btn" title="Start">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <h1 style="font-size:21px;font-weight:600;">Maps</h1>
        </div>
      </div>
      <span class="status-pill" id="map-mode-badge">Auto</span>
    </header>

    <main class="app-main">
      <div class="settings-search-pill">
        <span class="material-symbols-rounded" style="color:var(--md-sys-color-primary);">search</span>
        <input type="search" id="map-search" placeholder="Ort oder Ziel suchen (z. B. Nordhorn, Bahnhof, Park)..." oninput="filterPlaces()">
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
        <button type="button" class="m3-chip active" data-tr="driving" onclick="setTravelMode('driving', this)">Auto</button>
        <button type="button" class="m3-chip" data-tr="transit" onclick="setTravelMode('transit', this)">Bahn & Bus</button>
        <button type="button" class="m3-chip" data-tr="walking" onclick="setTravelMode('walking', this)">Zu Fuß</button>
      </div>

      <div class="map-canvas" id="map-canvas">
        <div class="map-road-h"></div>
        <div class="map-road-v"></div>
        <button type="button" class="map-pin" style="left:46%;top:52%;" onclick="selectPlace('nordhorn')">
          <span class="material-symbols-rounded filled" style="font-size:32px;color:#BA1A1A;">location_on</span>
          <span class="map-pin-label">Nordhorn Zentrum</span>
        </button>
        <button type="button" class="map-pin" style="left:24%;top:34%;" onclick="selectPlace('vechte')">
          <span class="material-symbols-rounded filled" style="font-size:28px;">park</span>
          <span class="map-pin-label">Vechtesee & Park</span>
        </button>
        <button type="button" class="map-pin" style="left:72%;top:66%;" onclick="selectPlace('station')">
          <span class="material-symbols-rounded filled" style="font-size:28px;color:#0061A4;">train</span>
          <span class="map-pin-label">Bahnhof / Regio</span>
        </button>
      </div>

      <div class="m3-card" id="map-info-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
          <div>
            <div style="font-weight:700;font-size:17px;" id="place-title">Nordhorn Zentrum</div>
            <div class="settings-item-sub" id="place-coords">52.4359° N, 7.0714° E · Grafschaft Bentheim</div>
          </div>
          <span class="status-pill" id="route-eta">8 Min. · 2,4 km</span>
        </div>
        <p style="margin-top:10px;font-size:14px;" id="place-desc">Zentraler Knotenpunkt mit Einkaufsstraßen, Cafés und Anbindung an den Nahverkehr.</p>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
          <button type="button" class="m3-btn" onclick="startNavigation()">
            <span class="material-symbols-rounded" style="font-size:18px;">directions</span>
            <span>Route starten</span>
          </button>
          <a href="wetter.html" class="m3-btn m3-btn-tonal">Wetter am Ort</a>
        </div>
      </div>

      <div class="settings-group" style="margin-top:14px;" id="place-list"></div>
    </main>

    <nav id="sys-gesture-nav" class="gesture-nav"></nav>
  </div>

  <script src="system.js"></script>
  <script>AndroidOS.requireUnlocked(true);</script>
  <script>
    AndroidOS.mountShell();

    const PLACES = {
      nordhorn: {
        title: 'Nordhorn Zentrum',
        coords: '52.4359° N, 7.0714° E · Niedersachsen',
        desc: 'Zentraler Knotenpunkt mit Fußgängerzone, Vechte-Promenade und Nahverkehrsanbindung.',
        km: 2.4
      },
      vechte: {
        title: 'Vechtesee & Park',
        coords: '52.4480° N, 7.0490° E · Erholungsgebiet',
        desc: 'Beliebter Rundweg am Wasser, Spielplätze und Grünflächen für Spaziergänge.',
        km: 4.1
      },
      station: {
        title: 'Bahnhof / Regio',
        coords: '52.4260° N, 7.0920° E · Bahn & Bus',
        desc: 'Regionalverbindungen und Buslinien mit Umsteigemöglichkeiten in die Region.',
        km: 3.6
      }
    };

    let activePlaceKey = 'nordhorn';
    let travelMode = 'driving';

    function calcEta(km) {
      const speeds = { driving: 32, transit: 22, walking: 5 };
      const mins = Math.max(2, Math.round((km / (speeds[travelMode] || 25)) * 60));
      return `${mins} Min. · ${km.toFixed(1).replace('.', ',')} km`;
    }

    function setTravelMode(mode, btn) {
      travelMode = mode;
      document.querySelectorAll('[data-tr]').forEach(b => b.classList.toggle('active', b === btn));
      const labels = { driving: 'Auto', transit: 'Bahn & Bus', walking: 'Zu Fuß' };
      document.getElementById('map-mode-badge').textContent = labels[mode] || 'Auto';
      renderMapDetails();
    }

    function selectPlace(key) {
      if (PLACES[key]) activePlaceKey = key;
      renderMapDetails();
    }

    function startNavigation() {
      const p = PLACES[activePlaceKey];
      AndroidOS.showToast(`Navigation zu „${p.title}“ (${calcEta(p.km)}) gestartet.`);
    }

    function filterPlaces() {
      const q = (document.getElementById('map-search').value || '').trim().toLowerCase();
      const matchKey = Object.keys(PLACES).find(k => {
        const p = PLACES[k];
        return p.title.toLowerCase().includes(q) || p.coords.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q);
      });
      if (q && matchKey) {
        activePlaceKey = matchKey;
      }
      renderMapDetails(q);
    }

    function renderMapDetails(filterQ = '') {
      const p = PLACES[activePlaceKey] || PLACES.nordhorn;
      document.getElementById('place-title').textContent = p.title;
      document.getElementById('place-coords').textContent = p.coords;
      document.getElementById('place-desc').textContent = p.desc;
      document.getElementById('route-eta').textContent = calcEta(p.km);

      const listEl = document.getElementById('place-list');
      const entries = Object.entries(PLACES).filter(([, item]) => {
        if (!filterQ) return true;
        return (item.title + ' ' + item.coords + ' ' + item.desc).toLowerCase().includes(filterQ);
      });
      listEl.innerHTML = entries.map(([k, item]) => `
        <button type="button" class="settings-item" onclick="selectPlace('${k}')">
          <span class="settings-badge" style="background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);">
            <span class="material-symbols-rounded">place</span>
          </span>
          <div style="flex:1;">
            <div class="settings-item-title">${item.title}</div>
            <div class="settings-item-sub">${calcEta(item.km)} · ${item.coords}</div>
          </div>
          <span class="material-symbols-rounded">chevron_right</span>
        </button>
      `).join('');
    }

    renderMapDetails();
  </script>
</body>
</html>
